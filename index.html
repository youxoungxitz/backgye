function freshLine(pool){const m=G.me;m.recent=m.recent||[];const opts=pool.filter(x=>!m.recent.includes(x));const ln=pick(opts.length?opts:pool);m.recent.push(ln);if(m.recent.length>40)m.recent.shift();return ln}
function ambientText(k,t){const parts=[];if(chance(.45))parts.push(freshLine(OPENERS[tod()]||OPENERS['한밤']));else if(chance(.35))parts.push(freshLine(WX_OPEN[weather()[0]]||WX_OPEN['흐림']));
  parts.push(freshLine(chance(.7)?CELL_LINES[k]:TIER_LINES[t]));return parts.join(' ')}

   {l:'숨죽이고 무시한다',s:'nerve',dc:10,ok:{t:'노크가 멎었다. 아침에 문 앞에 진흙 묻은 발자국이 있었다. 맨발이다. 발가락이 여섯 개.',rw:{mind:-5}},no:{t:'노크가 계속된다. 점점 아래쪽에서. 바닥 가까이에서. 문틈 바로 앞에서.',rw:{mind:-10},bad:1,fear:1}}]},
  open:{t:'복도엔 아무도 없다. 형광등 하나가 흔들린다.\n문을 닫고 돌아서니, 방 안 의자 방석이 움푹 꺼져 있다. 만져 보니 따뜻하다.',o:[
   {l:'방을 샅샅이 살핀다',s:'sen',dc:12,ok:{t:'침대 밑에서 낯선 손거울을 찾았다. 거울 속 내 방에는 사람이 한 명 더 앉아 있다.',rw:{item:'mirror',mind:-10},bad:1},no:{t:'아무것도 없다. 그런데 칫솔이 두 개가 됐다.',rw:{mind:-8},bad:1}},
   {l:'그냥 불을 끄고 잔다',r:{t:'잤다. 꿈에서 누가 내 이불을 목까지 덮어 주었다. 아침에 이불은 정말 목까지 덮여 있었다.',rw:{mind:-4,en:1}}}]}}},
 stairs:{n:'계단 세기',w:(d,t)=>t===1||t===2,s:{
  start:{t:'계단을 세며 내려간다. 스물넷, 스물다섯….\n아래층 계단참이 보이지 않는다. 형광등 간격이 점점 넓어진다.',o:[
   {l:'계속 센다',s:'nerve',dc:12,ok:{t:'마흔넷에서 계단참이 나왔다. 올라올 땐 스물넷이었다.\n벽에 누가 못으로 「44」라고 긁어 놓았다. 그 밑에 더 작게 「너도?」',rw:{clue:1,mind:-6}},no:{go:'endless',t:'숫자가 쉰을 넘었다. 아래에서 누가 같이 세는 소리가 들린다. 한 박자 늦게.'}},
   {l:'되돌아 올라간다',r:{t:'세 계단 만에 원래 층이다. 숨이 찬다. 다리가 후들거린다. 한참 내려갔다 올라온 것처럼.',rw:{en:-1}}},
   {l:'눈을 감고 내려간다',s:'sen',dc:11,ok:{t:'발끝으로 더듬어 내려왔다. 눈을 뜨니 원래 가려던 층이다.',rw:{}},no:{go:'endless',t:'눈을 떴는데도 어둡다. 계단은 계속된다.'}}]},
  endless:{t:'숫자가 백을 넘었다. 계단은 끝나지 않고, 벽의 층 표시가 점점 낡아 간다.\n마지막 표시는 손으로 쓴 「0」.',o:[
   {l:'난간을 넘어 뛰어내린다',s:'agi',dc:13,ok:{t:'아래층 바닥에 굴렀다. 무릎이 까졌다. 올려다보니 계단은 고작 세 칸이다.',rw:{hp:-8,mind:-6}},no:{t:'난간 너머도 계단이다. 계단이 계단을 감싸고 있다.',rw:{hp:-12,mind:-14,fx:'delirium'},bad:1,fear:1}},
   {l:'소리 내어 내 이름을 부른다',r:{t:'내 이름을 크게 불렀다. 위에서 누가 대답한다. 그 목소리를 따라 올라오니 원래 층이다.\n대답한 목소리가 누구였는지는 생각하지 않기로 했다.',rw:{mind:-8}}}]}}},
 photo:{n:'단체 사진',w:(d,t)=>t===2,s:{
  start:{t:'공방 바닥에 사진 한 장. 성채 옥상에서 찍은 단체 사진이다.\n맨 뒷줄 가운데, 내가 서 있다.',o:[
   {l:'사진을 뒤집어 본다',r:{t:'뒷면에 날짜. 내가 성채에 오기 4년 전이다.\n그 아래 볼펜으로 「돌아왔구나」.',rw:{clue:1,mind:-8},bad:1}},
   {l:'주머니에 넣는다',r:{t:'사진을 주머니에 넣었다. 걸을 때마다 주머니 속에서 누가 소곤거린다. 무리 지어.',rw:{item:'film',mind:-5}}},
   {l:'찢는다',s:'str',dc:8,ok:{t:'사진이 찢어지지 않는다. 종이가 아니라 얇은 피부 같다. 바닥에 내려놓고 뒤도 안 보고 나왔다.',rw:{mind:-12},bad:1},no:{t:'사진 모서리에 손가락을 베였다. 피가 사진 속 내 얼굴에 떨어졌다.',rw:{hp:-5,mind:-6},bad:1}}]}}},
 cat:{n:'검은 고양이',w:()=>true,s:{
  start:{t:'검은 고양이가 앞서 걷다 멈춰 돌아본다. 노란 눈. 꼬리를 한 번 흔든다.\n따라오라는 것 같다.',o:[
   {l:'따라간다',r:{go:'follow',t:'고양이는 공방 뒤 좁은 틈으로 몸을 밀어 넣는다. 어깨가 겨우 들어간다.'}},
   {l:'쪼그려 앉아 쓰다듬는다',r:{t:'고양이가 손에 머리를 비빈다. 따뜻하다. 골골거리는 소리. 오랜만에 숨이 편해진다.',rw:{mind:6}}},
   {l:'발을 굴러 쫓아낸다',r:{t:'고양이가 하악질을 하더니 벽으로 걸어 들어간다. 벽 속으로.',rw:{mind:-6},bad:1}}]},
  follow:{t:'틈 너머에 작은 방이 있다. 누가 고양이 밥그릇과 촛불을 놓아두었다. 촛농이 아직 말랑하다.\n벽에 실종자 사진이 빼곡하다.',o:[
   {l:'사진을 하나하나 살핀다',s:'sen',dc:11,ok:{t:'사진 중 하나에 낯익은 얼굴. 국숫집 주인이다. 사진 아래 날짜는 30년 전.\n그런데 그때도 지금과 똑같은 얼굴이다.',rw:{clue:1,mind:-6}},no:{t:'살필수록 사진 속 얼굴들이 전부 이쪽을 향해 있다는 걸 알게 된다. 처음엔 옆을 보고 있었는데.',rw:{mind:-10},bad:1,fear:1}},
   {l:'촛불을 끄고 나온다',r:{t:'촛불을 끄자 고양이가 길게 운다. 나오는 길에 발소리가 하나 늘었다.',rw:{mind:-6,fx:'followed'},bad:1}},
   {l:'밥그릇에 먹을 걸 놓아 둔다',r:{t:'주머니 속 비스킷을 부숴 놓았다. 나올 때 고양이가 따라 나와 발치에 동전 하나를 떨어뜨렸다. 젖은 동전.',rw:{money:10,mind:3}}}]}}},
 errand:{n:'이웃의 부탁',w:(d,t)=>t===1&&d!==3,s:{
  start:{t:'옆집 사람이 문을 반쯤 열고 봉투를 내민다.\n「4동 1204호에 이것 좀 전해 줄래요? 내가 가면 안 돼서.」',o:[
   {l:'받아서 전해 준다',r:{go:'deliver',t:'봉투가 생각보다 무겁다. 안에서 무언가 굴러다닌다.'}},
   {l:'거절한다',r:{t:'「그래요.」 이웃이 문을 닫는다.\n문 너머에서 「다른 사람 찾아야겠네」 하는 목소리. 둘이다. 그 집은 혼자 산다.',rw:{mind:-3}}},
   {l:'몰래 봉투를 열어 본다',s:'sen',dc:10,ok:{t:'봉투 안엔 녹슨 열쇠 하나와 쪽지. 「돌려줄게. 이제 네 차례야.」',rw:{clue:1,mind:-4}},no:{t:'봉투가 찢어지며 흙이 쏟아진다. 젖은 흙. 지렁이 한 마리가 꿈틀거린다.',rw:{mind:-8},bad:1}}]},
  deliver:{t:'4동 1204호. 문패가 없다.\n문 아래 틈으로 봉투를 밀어 넣자 안에서 받아 가는 손. 하얗고 길다.\n「고마워요. 이건 수고비.」 문틈으로 지폐가 밀려 나온다. 젖어 있다.',o:[
   {l:'받는다',r:{t:'지폐를 받았다. 마르고 나니 지폐 속 인물 얼굴이 조금 웃고 있다.',rw:{money:30,mind:-5}}},
   {l:'안 받고 돌아선다',r:{t:'돌아서는데 등 뒤에서 문이 조금 열린다. 안은 내 방과 똑같이 생겼다. 내 침대, 내 컵, 내 의자. 의자에 누가 앉아 있다.',rw:{mind:-9,clue:1},bad:1,fear:1}}]}}},
 neon:{n:'꺼지는 간판',w:(d,t)=>t===3&&(hour()>=18||hour()<6),s:{
  start:{t:'골목 간판 불이 하나씩 꺼진다. 저쪽 끝에서부터, 이쪽으로. 한 칸씩.\n꺼진 간판 아래 서 있던 사람들이 보이지 않는다.',o:[
   {l:'불 켜진 쪽으로 뛴다',s:'agi',dc:11,ok:{t:'마지막 간판 아래까지 뛰었다. 돌아보니 골목 간판이 다시 다 켜져 있다. 사람들도 그대로다. 아무도 나를 보지 않는다.',rw:{mind:-4}},no:{t:'내 머리 위 간판이 꺼졌다.\n어둠 속에서 누가 내 이름을 부른다. 아주 가까이에서.',rw:{mind:-12,fx:'followed'},bad:1,fear:1}},
   {l:'제자리에 서서 눈을 감는다',s:'nerve',dc:12,ok:{t:'눈꺼풀 너머가 어두워졌다가 다시 밝아진다. 눈을 뜨니 붉은 등 아래다. 발밑에 누가 떨어뜨린 지폐.',rw:{money:20,mind:-5}},no:{t:'눈을 감았는데도 간판 꺼지는 소리가 들린다. 딸깍, 딸깍, 내 앞에서 멈춘다.',rw:{mind:-12},bad:1,fear:1}}]}}},
 tv:{n:'창문 속 텔레비전',w:(d,t)=>t===1&&d!==1,s:{
  start:{t:'복도 창문 너머 맞은편 집 텔레비전이 켜져 있다. 화면에 이 복도가 나온다.\n화면 속 복도에 내가 서 있다. 이쪽을 보고.',o:[
   {l:'손을 흔들어 본다',r:{go:'wave',t:'손을 들었다.'}},
   {l:'창문 커튼을 친다',r:{t:'커튼을 치는 순간, 화면 속 나는 커튼을 치지 않았다. 커튼 너머로 화면 불빛이 한참 새어 나왔다.',rw:{mind:-6},bad:1}},
   {l:'맞은편 집 문을 두드린다',s:'talk',dc:11,ok:{t:'노인이 나와서 귀찮다는 듯 말한다. 「그 텔레비전? 고장 난 지 오래야. 채널이 하나만 나와.」 「어느 채널요?」 「여기.」',rw:{mind:-4,clue:1}},no:{t:'아무도 나오지 않는다. 대신 텔레비전 화면 속 내가 문을 두드리는 나를 보고 있다.',rw:{mind:-10},bad:1,fear:1}}]},
  wave:{t:'화면 속 나는 손을 들지 않는다.\n대신 천천히 고개를 기울인다. 내가 하지 않은 동작을.',o:[
   {l:'따라 고개를 기울인다',r:{t:'고개를 기울이자 화면 속 내가 웃는다. 텔레비전이 꺼진다. 그날 밤 거울을 볼 때마다 고개가 조금 기울어져 있었다.',rw:{mind:-10,fx:'delirium'},bad:1}},
   {l:'그 자리를 떠난다',r:{t:'계단까지 걸었다. 뒤를 보지 않았다. 등 뒤에서 텔레비전 소리가 따라왔다. 계단 하나 아래까지.',rw:{mind:-6}}}]}}},
};
/* 괴담 장소의 두 번째 조우 */
const HAUNT2={
 noodle:{n:'4번 테이블',red:1,s:{
  start:{t:'4번 테이블에 앉자 맞은편 의자가 저절로 빠진다. 누군가 앉는 소리. 아무도 없다.\n주인이 아무렇지 않게 국수 두 그릇을 내온다. 「맛있게 드세요.」',o:[
   {l:'맞은편으로 국수 한 그릇을 밀어 준다',r:{t:'그릇이 천천히 비워진다. 후루룩 소리. 젓가락이 그릇을 두 번 두드린다.\n다 먹고 나자 의자가 다시 들어간다. 탁자 위 김 서린 자국에 손가락 글씨. 「고마워. 또 와.」',rw:{mind:-8,clue:1},bad:1}},
   {l:'말을 건다',s:'talk',dc:12,ok:{t:'「여기 자주 오세요?」\n한참 뒤 젓가락이 그릇을 두드린다. 네 번. 수첩에 나도 모르게 「4」가 적혀 있다.',rw:{clue:1,mind:-6}},no:{t:'「응. 네가 오기 전부터.」\n대답이 귀 바로 옆에서 들렸다.',rw:{mind:-15,fx:'delirium'},bad:1,fear:1}},
   {l:'돈을 놓고 바로 일어선다',s:'agi',dc:11,ok:{t:'문을 나서는데 주인이 뒤에서 부른다. 「일행분은요?」 대답하지 않았다.',rw:{mind:-5}},no:{t:'일어서려는데 의자가 움직이지 않는다. 누가 의자 다리를 발로 누르고 있다.\n국수가 다 식을 때까지 앉아 있었다.',rw:{mind:-12},bad:1,fear:1}}]}}},
 dentist:{n:'한빛치과',red:1,s:{
  start:{t:'셔터가 끝까지 올라가 있다. 대기실 텔레비전에서 9년 전 치약 광고가 나온다.\n접수창엔 아무도 없다. 진료실 안에서 드릴 소리.\n「다음 분.」\n내 이름을 부른다.',o:[
   {l:'진료실로 들어간다',r:{extract:true,t:'진료실 문을 열자 소독약 냄새가 확 끼친다. 의사가 마스크 위로 눈웃음을 짓는다.'}},
   {l:'대기실 의자에 앉아 기다린다',s:'nerve',dc:12,ok:{t:'드릴 소리가 멎었다. 진료실에서 사람이 나온다. 입을 손으로 가린 채. 지나치며 속삭인다. 「도망가요.」\n그 사람을 따라 나오니 셔터가 반쯤 내려가 있다. 그 사람은 없다.',rw:{mind:-8,clue:1}},no:{extract:true,t:'기다리다 깜빡 졸았다. 눈을 뜨니 진료 의자 위다.'}},
   {l:'텔레비전을 끈다',r:{t:'텔레비전이 꺼지자 드릴 소리도 멎는다. 대기실 형광등이 하나씩 꺼진다. 마지막 하나가 내 머리 위에서 깜빡인다.\n어둠 속에서 셔터 아래로 기어 나왔다. 무릎에 녹슨 기구 하나가 걸려 나왔다.',rw:{mind:-10,item:'anesth'},bad:1,fear:1}}]}}},
 phone:{n:'공중전화',red:1,s:{
  start:{t:'공중전화 부스 안에 누가 서 있다. 등을 돌린 채 통화 중이다.\n「응, 응. 지금 바로 뒤에 있어.」',o:[
   {l:'통화가 끝나길 기다린다',s:'nerve',dc:11,ok:{t:'그 사람이 수화기를 내려놓고 나온다. 얼굴을 보기 전에 정문 쪽으로 사라진다.\n수화기가 따뜻하다. 반환구에 동전이 수북하다.',rw:{money:20,mind:-6}},no:{t:'그 사람이 수화기를 든 채 천천히 돌아본다.\n얼굴을 보기 전에 눈을 감았다. 「찾았어.」 수화기에 대고 하는 말이었다.',rw:{mind:-14,fx:'followed'},bad:1,fear:1}},
   {l:'돌아선다',r:{t:'등 뒤에서 「응, 이제 간다」 하는 소리. 부스 문이 열리는 소리.',rw:{mind:-6,fx:'followed'},bad:1}},
   {l:'부스 유리를 두드린다',r:{t:'두드리는 순간 부스 안은 비어 있다. 수화기만 줄에 매달려 흔들린다.\n귀를 대니 내 숨소리가 들린다. 조금 늦게. 수화기 줄에 종이가 묶여 있다.',rw:{mind:-10,item:'number'},bad:1}}]}}},
 floor13:{n:'13층',red:1,s:{
  start:{t:'12층 계단참에서 엘리베이터 도착 종소리가 들린다. 띵.\n성채에 엘리베이터는 없다.\n계단 위 「13」 표지판에 불이 켜져 있다.',o:[
   {l:'올라간다',r:{go:'inside',t:'계단은 열두 칸이다. 오를 때마다 형광등이 하나씩 켜진다. 1301호 문이 열려 있다.'}},

  {l:'쫓아낸다',s:'agi',dc:11,ok:{t:'손을 휘젓자 비둘기가 날아오른다. 날아가며 내 이름을 한 번 불렀다.',rw:{mind:-3}},no:{t:'휘두른 손에 깃털 대신 긴 머리카락이 감겨 있다.',rw:{mind:-10},bad:1,fear:1}},
  {l:'노인에게 묻는다',r:{t:'노인은 비둘기를 세지 않는다. 「열두 마리야. 늘 열두 마리.」\n노인의 수첩에는 날짜마다 12가 적혀 있다. 오늘 칸만 비어 있다.',rw:{mind:-4,clue:1}}}]}}},
 bellfour:{n:'종루',red:1,s:{start:{t:'줄을 당기기도 전에 종이 울린다.\n하나, 둘, 셋, 넷.\n그리고 조용해진다. 다섯 번째가 올 것만 같은 정적.',o:[
  {l:'다섯 번째를 기다린다',r:{t:'…쿵.\n다섯 번째는 종소리가 아니었다. 내 방문을 두드리는 소리였다. 이 높이에서 들릴 리가 없는데.',rw:{mind:-15,fx:'followed'},bad:1,fear:1,hidden:'bell'}},
  {l:'곧장 내려간다',r:{t:'계단을 내려오는 동안 등 뒤에서 종이 한 번 더 울렸다. 돌아보지 않았다.\n종소리가 몸에 남아 있다.',rw:{mind:-3,fx:'bell'},hidden:'bell'}}]}}},
 neighbor:{n:'옆 칸',s:{start:{t:'철망 너머 옆 칸에서 숨소리가 난다. 들이쉬고, 내쉬고.\n어느새 내 숨과 박자가 같다.',o:[
  {l:'같이 숨을 멈춘다',r:{t:'숨을 멈춘다. 옆 칸의 숨도 멈춘다.\n한참 뒤, 철망 너머에서 아주 작게 「고마워」.\n옆 칸은 원래 비어 있다.',rw:{mind:-4,clue:1},hidden:'cage'}},
  {l:'말을 건다',s:'talk',dc:12,ok:{t:'「거기 누구 있어요?」 숨소리가 멎고, 웃음 섞인 대답이 돌아온다.\n「너 들어오기 전부터 있었어.」\n이불 밑에 누가 두고 간 동전이 있다.',rw:{money:20,mind:-6}},no:{t:'대답은 없다. 숨소리가 철망에 바짝 붙는다. 철망이 내 쪽으로 휜다.',rw:{mind:-12},bad:1,fear:1}},
  {l:'철망을 두드린다',r:{t:'두드리자 숨소리가 멎는다.\n그리고 내 칸 침대 밑에서 다시 시작된다.',rw:{mind:-10,fx:'followed'},bad:1}}]}}},
 envelope:{n:'형님 심부름',s:{start:{t:'형님이 봉투를 건넨다. 「4동 13층 1301호.」\n13층은 없다. 형님은 농담하는 얼굴이 아니다.',o:[
  {l:'간다',s:'nerve',dc:12,ok:{t:'12층과 14층 사이, 길어진 계단참에 문이 하나 있다.\n문을 두드리자 문틈으로 하얀 손만 나와 봉투를 받아 간다. 손톱이 길다.\n돌아오니 형님은 아무것도 묻지 않았다.',rw:{merit:5,money:30,mind:-8}},no:{t:'계단참을 몇 번을 오르내려도 1301호가 없다.\n돌아오니 형님 책상 위에 봉투가 놓여 있다. 뜯겨 있다. 받는 사람이 이미 가져간 것처럼.',rw:{merit:2,mind:-12},bad:1,fear:1}},
  {l:'못 하겠다고 한다',r:{t:'형님이 봉투를 다른 놈에게 건넨다. 그놈은 그날 밤 돌아오지 않았다.',rw:{mind:-6,merit:-2},bad:1}}]}}},
 redsam:{n:'적등방 숙소층',red:1,s:{start:{t:'「삼경이 여긴 웬일이야.」\n복도의 사내들이 길을 막지는 않는다. 다만 아무도 눈을 떼지 않는다.\n복도 끝 마작방에서 넷이 패를 치고 있다. 그중 하나는 의원 게시판의 실종 전단 속 얼굴이다.',o:[
  {l:'그 사람에게 말을 건다',s:'talk',dc:12,ok:{t:'「집에 가셔야죠.」\n그 사람이 패를 쥔 채 웃는다. 「집? 나 여기 사는데.」\n전단 날짜를 보여 주자 손에서 패가 떨어진다. 아무것도 그려지지 않은 패다. 일어선 자리에 종이 한 장이 남았다.',rw:{sam:{cleanup:1},clue:1,mind:-6}},no:{t:'말을 걸자 마작방의 넷이 동시에 나를 본다. 사내 하나가 어깨를 툭 친다.\n「삼경 얼굴은 잘 기억해 둘게.」',rw:{mind:-6,fx:'markR'},bad:1}},
  {l:'전단과 얼굴을 몰래 비교한다',s:'sen',dc:13,ok:{t:'틀림없다. 다만 전단 속 얼굴은 웃고 있지 않았는데, 저 사람은 웃고 있다.\n조용히 빠져나와 의원에 보고했다.',rw:{sam:{cleanup:1},mind:-4}},no:{t:'너무 오래 쳐다봤다. 마작방 문이 탁 닫힌다. 복도의 사내들이 이제 노골적으로 웃는다.',rw:{fx:'markR',mind:-4},bad:1}},
  {l:'돌아간다',r:{t:'등 뒤에서 패 섞는 소리가 다시 시작된다. 넷이 아니라 다섯 사람 몫이다.',rw:{mind:-3}}}]}}},
 myrule:{n:'삼경 숙소층',s:{start:{t:'어제 떼어 낸 수칙이 내 방문에 붙어 있다.\n내 글씨다. 쓴 기억이 없다.',o:[
  {l:'떼어 낸다',r:{t:'떼어 내자 그 아래 같은 종이가 한 장 더 붙어 있다. 그 아래에도.',rw:{mind:-8},bad:1}},
  {l:'그대로 둔다',r:{t:'그날 밤 문 앞에서 누가 수칙을 소리 내어 읽었다. 내 목소리로.\n아침에 보니 종이 끝에 한 줄이 늘어 있다.',rw:{mind:-6,clue:1}}}]}}},
 finger:{n:'어묵 공장',s:{start:{t:'컨베이어 위로 어묵이 줄지어 지나간다. 그중 하나가 손가락 모양이다. 마디도 있다.\n세어 보면 늘 하나가 남는다.',o:[
  {l:'집어 든다',s:'nerve',dc:12,ok:{t:'그냥 어묵이다. 손가락 모양일 뿐.\n퇴근할 때 반장이 말없이 출입증 하나를 건넨다. 「13번. 네 거야.」\n이 공장 직원은 12번까지다.',rw:{money:25,item:'card13',mind:-6,fx:'oily'}},no:{t:'집어 드는 순간 어묵이 내 손가락을 쥔다.',rw:{money:25,mind:-14,hp:-5,fx:'oily'},bad:1,fear:1}},
  {l:'못 본 척한다',r:{t:'퇴근할 때 손가락을 세어 봤다. 열 개다. 다시 세어 보니 열한 개. 세 번째에 열 개.',rw:{money:25,mind:-8,fx:'oily'},bad:1}}]}}},
 hand:{n:'정문 배수로',red:1,s:{start:{t:'줄이 팽팽해진다. 끌어올린 것은 손이다. 사람 손. 차갑고, 물에 불지 않았다.\n그 손이 내 손목을 잡는다.',o:[
  {l:'뿌리친다',s:'str',dc:12,ok:{t:'손을 뿌리치자 손이 물속으로 사라진다. 손바닥에 남은 건 내가 어제 잃어버린 단추 하나.',rw:{mind:-8,clue:1}},no:{t:'손이 나를 물가로 끌어당긴다. 겨우 빠져나왔을 때 손목에 손가락 자국이 다섯 개 남아 있었다. 여섯 개였나.',rw:{mind:-14,hp:-8,fx:'followed'},bad:1,fear:1}},
  {l:'손을 잡아 준다',s:'nerve',dc:13,ok:{t:'잡아 주자 손이 천천히 힘을 푼다. 물 위로 젖은 편지 한 통이 떠오른다.',rw:{mind:-6,item:'letter',rep:2}},no:{t:'잡아 주는 순간 깨달았다. 이 손은 도움을 바라는 게 아니다.',rw:{mind:-16},bad:1,fear:1}}]}}},
 callout:{n:'정문 배수로',s:{start:{t:'물 흐르는 소리 사이로 누가 이름을 부른다.\n바깥 이름이다. 성채에 오기 전에 쓰던 이름.',o:[
  {l:'대답한다',r:{t:'「…네.」\n대답하는 순간 물소리가 멎는다. 바깥으로 이어지는 쇠창살 너머에 누가 서 있다. 나와 똑같이 생긴 사람이 손을 흔든다.',rw:{mind:-14,fx:'delirium'},bad:1,fear:1,hidden:'drain'}},
  {l:'대답하지 않는다',r:{t:'이름이 몇 번 더 불리다가 멀어진다. 마지막으로 불린 이름은 처음 듣는 이름이었다.',rw:{mind:-2},hidden:'drain'}}]}}},
 safe:{n:'적등방 사무실',s:{start:{t:'철문 옆 금고 안에서 똑, 똑, 똑. 두드리는 소리.\n사무실 사람들은 아무도 신경 쓰지 않는다.',o:[
  {l:'같이 두드린다',r:{t:'똑, 똑.\n안에서 소리가 멈추고, 한참 뒤 아주 작게 대답한다. 「아직이야?」',rw:{mind:-8,clue:1},bad:1}},
  {l:'사무원에게 묻는다',s:'talk',dc:11,ok:{t:'「아, 그거요. 이자예요. 빚이 불어나는 소리.」\n사무원이 웃지도 않고 말한다.',rw:{mind:-4}},no:{t:'사무원이 고개를 든다. 「적등방도 아니면서 여긴 왜 왔어요.」',rw:{fx:'markR',mind:-3},bad:1}},
  {l:'나간다',r:{t:'문을 닫자 노크 소리도 멈췄다. 문 안쪽에서 들은 것처럼.',rw:{mind:-2}}}]}}}};

/* 괴담 장소 (평소 → 흔적 → 조우) */
function hauntG(id,normal,trace,normalRw){const r=hauntRoll(id),nm=PLACES[id].n;
  if(r==='normal'){done(nm,freshLine(normal.concat(XN[id]||[])),give(normalRw()));return}
  if(r==='trace'){addTrace(id);done(nm,freshLine(tracePool(id,trace.concat(XT[id]||[])))+fearLine(),give({mind:-4}),true);return}
  resetTrace(id);flicker();playEv(V12,id)}
const antennaVisit=()=>hauntG('antenna',['주파수를 돌리자 레이란 시내 방송이 잡힌다. 일기 예보, 경마 결과, 광고 노래. 바깥은 여전히 바깥이다.','바깥 라디오에서 성채 이야기는 한마디도 나오지 않는다. 이상하게 마음이 놓인다.','잡음 사이로 바다 건너 방송이 흐른다. 알아들을 수 없는 말인데 마음이 편해진다.'],
  ['잡음 사이로 내 목소리가 들린다. 「…여기 있어요.」 내가 한 적 없는 말이다.','모든 주파수에서 같은 숨소리가 난다.','주파수를 아무리 돌려도 바늘이 13에 멈춘다.'],()=>({mind:5,item:chance(.1)?'wire':null}));
const workshopVisit=()=>hauntG('workshop',['천을 들추자 녹슨 재봉틀이 나온다. 쓸 만한 부품 몇 개를 챙겼다.','기계 밑에서 단추 한 줌을 주웠다. 다 같은 옷에서 떨어진 단추다.','천 아래 기계에 먼지가 하나도 없다. 누가 매일 닦는 것처럼.'],
  ['천 아래가 따뜻하다. 숨 쉬듯 천이 오르내린다.','천을 들추기도 전에 재봉틀이 한 땀 움직였다.','바닥에 분필로 사람 치수가 적혀 있다. 내 치수다.'],()=>({money:ri(5,15)}));
function visit(id){if(!ready())return;if(id!=='noodle'&&!spend(1))return;const f={noodle,dentist,phone,floor13,well,photo:photoStudio,bath}[id]||PLACES[id].visit;f()}

/* 생활 장소 */
function feedPigeon(){const m=G.me,p=m.pigeon=m.pigeon||{n:12},d=today();
  if(p.fed!=null&&p.fed<d&&!p.got){p.got=true;p.n++;const r=Math.random();
    if(r<.12){playEv(V12,'pigeon');return}
    if(r<.55){done('비둘기장','비둘기 한 마리가 동전을 물고 돌아왔다. 어디서 났는지는 묻지 않기로 했다.',give({money:ri(5,15)}));return}
    if(r<.8){const rm=setRumor();const out=give({clue:chance(.3)?1:0});done('비둘기장',`비둘기 발목에 쪽지가 묶여 있다.\n「${rm}」`,out);return}
    const it=pick(['number','film','plate','button']);done('비둘기장','비둘기가 무언가를 물고 와 발치에 떨어뜨린다. 성채 어딘가에서 주워 온 물건이다.',give({item:it}));return}
  if(p.fed===d)return toast('모이는 이미 줬어요. 내일 비둘기가 무언가 물어 올 거예요.');
  if(m.money<3)return toast('모이 값 $3가 필요해요.');
  openScene({id:'pigeonfeed',title:'비둘기장',text:`비둘기장 노인이 철망을 열어 준다. 비둘기가 ${p.n}마리.\n「모이 주면 내일 뭐라도 물어 와.」`,choices:[
    {l:'모이를 준다 ($3)',run:()=>{m.money-=3;p.fed=d;p.got=false;done('비둘기장','모이를 뿌리자 비둘기들이 한꺼번에 내려앉는다. 노인이 수를 센다. 「하나, 둘…」\n열둘에서 멈추고 고개를 갸웃한다. 한 마리가 남는다.',['$-3','내일 비둘기가 무언가 물어 와요'])}},
    {l:'그냥 내려간다',run:()=>done('비둘기장','날갯짓 소리가 등 뒤에서 오래 이어졌다.',[])}]})}
function smokeAct(){if(!capOK('smoke',3,'오늘은 담배를 많이 피웠어요. 목이 따갑다.'))return;capUse('smoke');
  if(chance(.15)){dexAdd('x:smoke');done('담배 한 대','셋이 피웠는데, 바닥의 꽁초가 넷이다.\n그중 하나는 아직 타고 있다. 필터에 립스틱 자국이 있다. 여기 여자는 없었다.',give({mind:-4,en:1}),true);return}
  const rm=setRumor();done('담배 한 대',redRank()==='boss'?`방주가 옥상에 올라오자 사내들이 일제히 담배를 비벼 끈다. 한 명이 머뭇거리다 불을 붙여 드리며 낮게 말한다.\n「${rm}」`:`적등방 사람들 틈에서 담배를 나눠 피웠다. 누군가 지나가듯 말한다.\n「${rm}」`,[...give({mind:3,en:1}),'소문: 그곳의 조우 확률이 오늘 올라요'])}
function bellAct(){if(hour()!==2)return toast('종은 새벽 2시대(2:00~2:59)에만 칠 수 있어요. 증축 바로 전이에요.');if(!capOK('bell',1,'오늘은 이미 종을 쳤어요.'))return;capUse('bell');
  if(chance(.2)){flicker();playEv(V12,'bellfour');return}
  sfx('bell');addFx('bell');done('종 치기','녹슨 종이 무겁게 한 번 운다. 소리가 성채 구석구석으로 번져 나간다.\n아래층 어딘가에서 망치 소리가 잠깐 멈췄다.',['종소리 (증축 피해 1번 막음)'])}
function cageAct(){if(!capOK('cage',2,'옆 칸이 조용하다. 오늘은 더 말을 걸지 않는 게 좋겠다.'))return;capUse('cage');const r=Math.random();
  if(r<.25){playEv(V12,'neighbor');return}
  if(r<.4){done('옆 칸','옆 칸 사람이 철망 틈으로 꼬깃꼬깃한 종이를 밀어 준다. 「주웠어. 너 이런 거 모으지?」',give({clue:1}));return}
  const rm=setRumor();done('옆 칸',`철망 너머로 옆 칸 사람과 말을 섞었다. 얼굴은 보이지 않는다.\n「${rm}」`,[...give({mind:2}),'소문: 그곳의 조우 확률이 오늘 올라요'])}
function redhallAct(){const m=G.me;if(m.fugitive){caught('적등방 숙소층 한가운데서 누가 내 이름을 불렀다. 문이란 문이 한꺼번에 열렸다.');return}
  if(isRed()){const rk=redRank();if(rk==='boss'||rk==='head'){if(!capOK('errand',1,'오늘 순시는 끝났어요.'))return;capUse('errand');

 '「백계성 주민 수칙. 새벽 3시에서 4시 사이 망치 소리가 들리면 방에 머물 것.」',
 '골목 안쪽으로 붉은 등이 줄지어 매달려 있다. 등 아래 서 있던 사내들이 새로 들어온 사람의 얼굴을 한 번씩 훑어본다. 빚을 질 사람인지, 돈을 낼 손님인지 가늠하는 눈이다. 반대편 종루 쪽 계단에서는 완장을 찬 사람들이 손전등을 들고 오르내린다. 밤이 깊어지면 성채에서 밖을 돌아다니는 사람은 그들뿐이다.',
 '누군가 지나가면서 낮게 말한다.',
 '「여기 처음이지? 빚은 적등방이 받으러 오고, 밤에는 삼경이 돌아. 그것만 알아 두면 돼. 아, 그리고 새벽 세 시엔 절대 밖에 나오지 마.」']],
['백계성과 레이란',['레이란은 바다를 끼고 있는 항구도시다. 배가 들어오면 물건이 들어오고, 사람도 같이 들어온다. 그렇게 들어온 사람 중 몇은 다시 나가지 못하고 성채로 흘러든다.',
 '백계성이 서 있는 땅은 오래전에 맺은 조약이 꼬이는 바람에 어느 나라 땅도 아니게 되었다. 그래서 레이란 경찰은 정문 앞까지만 오고 그 안으로는 들어오지 않는다. 세금을 걷으러 오는 사람도, 건축 허가를 내주는 사람도, 죽은 사람을 서류에 올리는 사람도 없다. 성채 안의 규칙은 성채 사람들이 알아서 만들어 왔다.',
 '그러다 보니 갈 곳 없는 사람들이 하나둘 모여들었다. 난민과 밀항자, 빚에 쫓기는 사람, 죄를 짓고 도망친 사람, 누군가를 찾으러 들어온 사람, 그리고 원래부터 여기서 나고 자란 사람들. 한 복도에서 여러 나라 말이 오가지만, 누구도 상대의 진짜 이름을 묻지 않는다. 여기서는 그게 예의다.',
 '성채는 크게 네 동으로 나뉜다.',
 '1동 정문동(正門樓)은 바깥과 맞닿은 동이다. 녹색 공중전화와 차찬텡, 철창 하숙이 있어서 성채에 처음 들어온 사람은 대개 이 동에서 첫날 밤을 보낸다.',
 '2동 홍등동(紅燈樓)은 적등방의 동이다. 국숫집과 전당포, 마작방이 붙어 있고, 수로를 타야만 들어갈 수 있는 지하 도박장 홍등루가 그 아래에 있다. 이 동의 붉은 등은 꺼지는 날이 없다.',
 '3동 종루동(鐘樓)은 삼경이 지키는 동이다. 꼭대기에 녹슨 종이 매달린 종루가 있고, 아래쪽에는 삼경 의원과 수칙을 찍어 내는 인쇄소가 있다.',
 '4동 빈동(空樓)은 이름 그대로 거의 비어 있다. 간판 불은 대부분 꺼졌고 폐업한 치과와 멈춘 공방 정도만 남았다. 사람들은 숫자 4를 꺼리는 것처럼 이 동에 발을 들이는 것도 꺼린다.',
 '동마다 위로는 옥상과 안테나 숲이 있고, 아래로는 바닷물이 스며드는 수로가 흐른다. 성채에서 하늘이 보이는 곳은 옥상밖에 없고, 바깥으로 빠져나가는 건 수로의 물밖에 없다.',
 '바깥 사람들은 성채를 조금씩 잊어 가고 있다. 레이란 라디오는 성채 이야기를 하지 않고, 시내 지도에서 이 구역은 회색으로 칠해져 있을 뿐이다. 성채 사람들 중에는 그게 차라리 낫다는 사람도 있고, 그게 더 무섭다는 사람도 있다.']],
['밤의 증축',['새벽 세 시가 되면 성채 어딘가에서 망치 소리가 나기 시작한다.',
 '쿵, 쿵, 쿵. 벽 안쪽에서 울릴 때도 있고, 천장 위에서 들릴 때도 있고, 바로 옆방에서 나는 것처럼 가까울 때도 있다. 소리가 이어지는 동안 복도에는 덜 마른 시멘트 냄새가 퍼지고, 형광등이 하나씩 꺼져 간다. 그러다 네 시가 다가오면 언제 그랬냐는 듯 소리가 뚝 그친다.',
 '아침이 되면 성채는 어제와 조금 달라져 있다. 어제 없던 계단이 생기거나, 복도 끝에 처음 보는 문이 하나 늘어 있거나, 누군가의 방이 한 뼘쯤 좁아져 있다. 새로 생긴 계단은 하루 동안만 열려 있고, 다음 날 아침이면 그 자리가 다시 벽으로 막혀 있다.',
 '누가 짓는 건지는 아무도 모른다. 적등방 사람들도 모른다고 하고 삼경 사람들도 모른다고 한다. 성채에서 오래 산 노인들은 다만 이런 말을 한다. 증축이 있었던 다음 날에는 꼭 누군가 한 사람이 보이지 않는다고.',
 '그래서 백계성 주민 수칙의 첫 번째 줄에는 이렇게 적혀 있다. 「새벽 3시에서 4시 사이 망치 소리가 들리면 방에 머물 것. 누가 두드려도 문을 열지 말 것.」']],
['적등방(赤燈幫)',['홍등동 골목에 붉은 등이 걸린 곳은 모두 적등방의 구역이다. 그 불빛 아래서 벌어지는 일은 적등방이 책임지고, 적등방이 정리한다. 대놓고 그렇게 말하는 사람은 없어도 성채 사람이라면 다 알고 있다.',
 '적등방은 백계성의 범죄 조직이다. 성채에서 오가는 돈 대부분이 한 번은 이들의 손을 거친다.',
 '돈이 급한 사람에게는 돈을 빌려준다. 이자는 무겁고, 장부는 사무실 금고 안에 있다. 장부에 이름이 올라간 사람은 그날부터 적등방의 객이 된다. 홍등루의 마작판은 밤낮없이 돌아가는데, 판돈 대신 사람을 거는 테이블이 있다는 소문도 있다. 홍등동의 국숫집과 전당포, 차찬텡은 달마다 봉투를 낸다. 봉투를 내지 않은 가게는 얼마 안 가 간판 불이 꺼진다. 레이란 항구로 들어온 물건 중 세관을 거치지 않은 것들도 수로를 타고 성채로 흘러든다. 그게 누구 물건인지는 아무도 묻지 않는다.',
 '적등방 안에도 위아래가 있다. 빚을 지고 들어온 객(客)은 잡일과 심부름을 하면서 빚을 갚아 나간다. 빚을 절반까지 줄이고 공을 쌓으면 붉은 등을 들 자격이 생기는데, 이들을 등잡이라고 부른다. 등잡이는 다시 주먹을 쓰는 홍봉(紅棒)이나, 장부와 수금을 맡는 백선(白扇) 중 한 길로 간다. 한 구역을 통째로 맡아 보호비를 걷는 사람은 향주(香主)라고 불리고, 그 위에는 방주(幫主)가 있다. 성채 사람이라면 누구나 방주의 얼굴을 알지만, 가까이 가 본 사람은 없다.',
 '적등방에서 지켜야 하는 철칙은 하나뿐이다. 빚은 반드시 갚아야 한다. 돈이 없으면 일로 갚고, 일로도 안 되면 몸으로 갚는다. 사무실 장부 맨 뒤에는 금액 대신 혈액형과 키, 몸무게를 적는 칸이 따로 있다. 그 칸에 서명한 사람은 하룻밤 만에 빚이 줄어서 돌아오는데, 다들 옆구리에 붕대를 감고 있다. 같은 층 복래 정육점의 냉동고 안쪽 칸이 무엇을 넣어 두는 곳인지는 아무도 묻지 않는다.',
 '들어오는 건 쉽다. 장부에 서명 한 번만 하면 된다. 하지만 나가는 건 거의 불가능하다. 적등방을 나가겠다고 말을 꺼낸 사람은 많지 않았고, 실제로 나간 사람은 그보다도 적다. 나간 사람 중 몇은 손가락이 모자라고, 몇은 한쪽 눈이 없다. 나머지는 수로에서 발견되었다. 몰래 빠져나간 사람은 도망자가 되는데, 붉은 완장을 찬 사내들이 그 얼굴이 그려진 종이를 들고 한 달 동안 성채를 뒤지고 다닌다.',
 '그런데도 사람들은 제 발로 적등방을 찾아온다. 경찰도 법도 없는 곳에서 적등방은 한 번 한 약속만큼은 지키기 때문이다. 돈이 필요하면 빌려주고, 봉투를 낸 가게는 지켜 주고, 자기 구역에서 일어난 일은 밖으로 새어 나가지 않게 덮어 준다. 그래서 백계성 사람들은 적등방을 무서워하면서도, 적등방이 없는 성채는 잘 상상하지 못한다.']],
['삼경(三更)',['삼경은 밤 열한 시부터 새벽 한 시 무렵, 하룻밤 중에서 가장 깊은 시간을 가리키는 말이다. 백계성에서는 그 시간에 깨어 있는 사람들을 부르는 이름이기도 하다.',
 '삼경은 백계성의 자경단이다. 경찰이 들어오지 않는 성채에서 주민들이 직접 꾸린 야경꾼 모임으로 시작했다고 한다. 완장은 쓸 만한 천이면 아무거나 상관없고, 가진 거라고는 손전등과 호루라기, 수칙이 적힌 종이 다발이 전부다.',
 '삼경이 하는 일은 크게 세 가지다. 먼저 순찰이다. 다들 방에 틀어박혀 있어야 하는 증축 시간에도 삼경은 밖에 나가 있다. 망치 소리가 어디서 나는지, 어느 복도에 새 문이 생겼는지 귀를 기울이고 받아 적는다.',
 '다음은 수칙이다. 계단참마다 붙어 있는 주민 수칙을 찍어서 붙이고, 낡으면 새로 붙인다. 수칙을 어겼다고 벌을 주지는 않지만, 어긴 사람에게 무슨 일이 생겼는지는 빠짐없이 기록해 둔다.',
 '마지막은 수색이다. 사라진 사람을 찾아다니고, 끝내 찾지 못하면 삼경 의원 게시판에 실종 전단을 붙인다. 새로 생긴 계단에는 못을 박아 사람이 오르지 못하게 막는다.',
 '삼경에 갓 들어온 사람은 신참이라고 한다. 순찰과 현장 수습을 꾸준히 해내면 조 하나를 맡는 조장이 되고, 삼경 전체를 이끄는 사람은 대장이라고 부른다. 삼경은 돈을 많이 주지 않는다. 대신 삼경 완장을 차고 있으면 성채 사람들이 문을 열어 준다. 한밤중에 누가 문을 두드려도, 그게 삼경이면 연다.',
 '삼경 대원들은 만나면 「오늘도 세어 봤어?」 하고 인사를 나눈다. 계단 이야기를 하는 것 같기도 하고, 사람 이야기를 하는 것 같기도 하다.']],
['붉은 등과 종소리',['백계성에는 질서가 두 개 있다. 하나는 돈으로 돌아가고, 다른 하나는 수칙으로 돌아간다. 이 둘은 지금까지 한 번도 사이가 좋았던 적이 없다.',
 '적등방 쪽에서 보면 삼경은 장사를 방해하는 참견꾼들이다. 삼경이 의원 게시판에 붙여 놓은 실종 전단을 보면, 그 얼굴 중 절반은 적등방 장부에도 이름이 올라 있다. 삼경이 그 이야기를 꺼낼 때마다 홍등동의 붉은 등이 하나씩 더 켜진다.',
 '삼경 쪽에서 보면 적등방은 성채를 갉아먹는 사람들이다. 사람을 빚으로 묶어 두고, 그렇게 묶인 사람에게 하필 증축 시간에 심부름을 시킨다. 그렇게 나간 사람 가운데 몇은 끝내 돌아오지 않았다.',
 '증축을 대하는 방식도 정반대다. 적등방에게 새로 생긴 방은 새 구역이고, 새 가게고, 새로 걷을 보호비다. 그러니 누구보다 먼저 가서 깃발을 꽂아야 한다. 삼경에게 새로 생긴 방은 누군가 사라진 자리다. 그러니 누구보다 먼저 가서 못을 박아 막아야 한다.',
 '그래서 밤마다 비슷한 일이 되풀이된다. 새 계단이 생기면 붉은 완장과 삼경 완장이 거의 같은 시각에 그 앞에 도착한다. 대개는 한참 노려보다가 각자 돌아선다. 하지만 가끔은 그러지 않는다. 그런 밤에는 종루의 종이 세 번 울리고 홍등동의 불이 한꺼번에 꺼진다. 다음 날 아침 계단참에는 물이 흥건하게 고여 있고, 어느 쪽도 간밤에 무슨 일이 있었는지 입을 열지 않는다.',
 '그래도 두 세력 사이에 말로 정한 적은 없는 약속이 하나 있다. 정문 골목에서는 서로 손대지 않는다는 것이다. 바깥으로 이어지는 하나뿐인 골목에서 피가 흐르면 레이란 경찰에게 정문을 넘어올 핑계를 주게 되기 때문이다. 그래서 정문 차찬텡 창가 자리에는 가끔 붉은 완장과 삼경 완장이 나란히 앉아 밀크티를 마신다. 둘 다 끝까지 상대 쪽으로는 고개를 돌리지 않는다.',
 '성채 사람들은 그 둘 사이에서 하루하루를 산다. 낮에는 적등방에 봉투를 내고, 밤에는 삼경에게 문을 열어 준다. 어느 한쪽에 완전히 기대지 않고 버티는 사람이 백계성에서 오래 산다고들 한다.']],
['무소속',['어느 쪽에도 속하지 않은 사람들도 있다. 장부에 이름이 없고 완장도 차지 않은 사람들이다. 대부분 정문동 철창 하숙에서 철망 문 하나를 사이에 두고, 옆 칸 사람의 숨소리까지 들으며 지낸다.',
 '무소속에게는 번듯한 주소도, 정해진 생업도 없다. 신문을 돌리거나 짐을 나르거나 남의 빨래를 널어 주면서 하루하루를 버틴다. 그 대신 누구에게도 빚진 게 없고, 누구의 말도 듣지 않아도 된다.',
 '그렇다고 마음 편하게 사는 건 아니다. 적등방은 무소속을 언젠가 장부에 오를 사람으로 보고, 삼경은 언젠가 실종 전단에 오를 사람으로 본다. 무소속으로 오래 버틴 사람은 드물다.',
 '무소속이 고를 수 있는 길은 몇 가지가 있다. 홍등루에서 빚을 지고 적등방의 객이 되거나, 평판을 쌓아서 삼경 완장을 차거나, 주인 없는 문패를 구해 성채 어딘가에 자기 주소를 걸거나.',
 '적등방에서 도망친 사람도 무소속이 된다. 다만 그 사람들 이름 뒤에는 도망자라는 말이 하나 더 붙는다. 그들이 홍등동에 발을 들이면 붉은 등 아래 누군가가 그 이름을 부른다.']],
['주민 수칙과 숫자 4',['계단참마다 누렇게 바랜 종이가 한 장씩 붙어 있다. 백계성 주민 수칙이다. 지금은 삼경이 찍어서 붙이고 있지만, 맨 처음 누가 썼는지는 삼경도 모른다.',
 '수칙은 지켜도 되고 어겨도 된다. 다만 어긴 뒤에 무슨 일이 생기든 책임져 주는 사람은 없다. 수칙을 어긴 사람은 가끔 이상한 물건을 손에 쥐고 돌아오는데, 사람들은 그걸 밤물건이라고 부른다. 전당포 노인은 그게 어디서 났는지 묻지 않고 값을 쳐 준다.',

['시대',['때는 1980년대 끝무렵이다. 레이란 시내에는 빨간 이층버스가 다니고, 레코드 가게에서는 광둥어 유행가가 흘러나오고, 주말이면 경마장에 사람들이 몰린다. 바다 건너에서는 몇 년 뒤면 이 도시의 주인이 바뀐다는 이야기가 오가고, 그 때문인지 도시 전체가 어딘가 들떠 있으면서도 불안하다.',
 '성채 안의 시간은 바깥보다 조금 늦게 흐른다. 허리에는 삐삐를 차고, 급한 연락은 정문 골목 녹색 공중전화로 한다. 집집마다 브라운관 텔레비전에서 무협 드라마가 나오고, 카세트 라디오에서는 늘어진 테이프 소리가 난다. 비디오 가게에는 제목 없는 테이프가 쌓여 있고, 천장에서는 녹슨 선풍기가 미지근한 바람을 돌린다.',

 '성채 안에는 바깥에서는 허가를 받을 수 없는 가게들이 빼곡하다. 면허 없는 치과와 한약방, 간판 없는 이발소, 하루 종일 기계가 돌아가는 어묵 공장과 국숫집. 골목 위로는 전선이 거미줄처럼 엉켜 있고, 수도관에서 새는 물이 계단을 타고 흘러내린다. 햇빛이 들지 않는 복도는 낮에도 형광등을 켜 둬야 하고, 그 형광등은 늘 어딘가 하나씩 깜빡인다.',

 '바깥에서는 몇 년째 성채를 허문다는 말이 돈다. 레이란 신문에 가끔 그런 기사가 실리고, 정부 사람들이 정문 앞에 와서 사진을 찍어 가기도 한다. 하지만 성채 안에서 그 이야기를 진지하게 하는 사람은 없다. 허물기 전에 성채가 먼저 자랄 거라고, 노인들은 그렇게 말하며 웃는다.']]];

function boardFor(fac,di=dayIdx(T())){const m=G.me;const extra=m&&m.reroll&&m.reroll.d===di?(m.reroll[fac]||0):0;const list=QUESTS[fac],r=rng(di*13+fac.length*7+extra*101);const idx=[...list.keys()].sort(()=>r()-.5).slice(0,3);return idx.map(i=>({...list[i],key:`${di}:${fac}:${extra}:${i}`}))}
function rerollCost(fac){const m=G.me,di=dayIdx(T());const n=m.reroll&&m.reroll.d===di?(m.reroll[fac]||0):0;return 10+n*10}
function reroll(fac){if(!ready())return;const m=G.me,di=dayIdx(T()),c=rerollCost(fac);if(m.money<c)return toast(`$${c}이 필요해요.`);m.money-=c;if(!m.reroll||m.reroll.d!==di)m.reroll={d:di};m.reroll[fac]=(m.reroll[fac]||0)+1;log(`${fac==='free'?'일용직 게시판':FACS[fac]+' 의뢰판'}을 새로 받았다. $${c}`,'fac');toast('의뢰판이 바뀌었어요.');save();render()}
function doQuest(q){if(!ready())return;const m=G.me;if(m.qdone[q.key])return;if(q.need&&!(m.items[q.need]>0))return toast(`「${ITEMS[q.need].n}」이(가) 필요해요.`);if(!spend(2))return;
  if(q.need)m.items[q.need]--;const c=chk(q.s,q.dc);m.qdone[q.key]=true;const out=[c.txt,...give(c.ok?q.rw:q.fail)];const txt=pick(c.ok?(q.ok||['해냈다.']):(q.no||['실패했다.']));
  log(`의뢰 「${q.n}」 ${c.ok?'완료':'실패'}`,'fac');done(c.ok?`의뢰 완료 · ${q.n}`:`의뢰 실패 · ${q.n}`,txt,out,!c.ok)}

const REP_LEVELS=[[0,'낯선 얼굴'],[50,'눈에 익은 얼굴'],[150,'이름이 오가는 사람'],[300,'제법 알려진 사람'],[500,'이름난 사람'],[800,'소문이 따라붙는 사람'],[1200,'성채에 이름을 새긴 사람'],[1800,'모르는 이가 드문 사람'],[2500,'성채의 산증인']];
const REPN=r=>REP_LEVELS.reduce((n,v)=>r>=v[0]?v[1]:n,REP_LEVELS[0][1]);
function rankLabel(m){if(m.fugitive)return'무소속(도망자)';if(m.fac==='free')return'무소속 · '+REPN(m.rep||0);return FACS[m.fac]+' · '+RANKN[m.rank]}

function payDebt(n){const m=G.me;n=Math.min(n,m.debt,m.money);if(n<=0)return toast('갚을 돈이나 빚이 없어요.');m.money-=n;m.debt-=n;const cr=Math.max(1,Math.floor(n/50));if(m.fac==='red'&&!m.fugitive)m.credit=(m.credit||0)+cr;log(`빚 $${n}을 갚았다.`,'fac');toast(`$${n} 갚았어요.${m.fac==='red'?` 신용 +${cr}`:''}`);save();render()}

function gumify(s){return[...s].map(ch=>{const c=ch.charCodeAt(0);if(c<0xAC00||c>0xD7A3)return ch;const i=c-0xAC00,ini=Math.floor(i/588),rest=i%588;const map={9:3,10:4,12:3,14:16};return map[ini]!=null?String.fromCharCode(0xAC00+map[ini]*588+rest):ch}).join('')}

  if(!soft&&r<.18)return pick(DLR_ODD);
  if(!soft&&r<.3&&name.length>1){const a=[...name];a[ri(0,a.length-1)]='□';return a.join('')}
  if(r<.45&&G.me&&G.me.name&&name!==G.me.name)return G.me.name;

  let n;const all=[];while((n=w.nextNode())&&all.length<300){all.push(n);const r=n.parentElement.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight&&r.width>0)out.push(n)}return out.length?out:all}

  const steps=G.opts.soft?1:ri(2,6);let i=0,cur=orig;

   {l:'고개를 숙이고 지나간다',r:['지나가는데 하나가 중얼거린다. 「쟤 내일 들어오겠네.」',{mind:-5}]}]}],
 3:[
  {t:'벽에 설계도가 붙어 있다. 지금 내가 선 자리에 X 표시. X에서 화살표가 아래로.',o:[
   {l:'바닥을 판다',s:'str',dc:13,ok:['바닥 밑에 상자. 안에 설계도 조각 둘.',{clue:2}],no:['바닥 밑에 사람 손. 그 손이 바닥을 다시 덮는다. 안에서.',{mind:-14,hp:-6}]},
   {l:'설계도를 떼어 간다',s:'sen',dc:13,ok:['떼어 냈다. 뒤에 한 장이 더 있다. 둘 다 챙겼다.',{clue:1,money:20}],no:['떼자마자 벽이 움직인다. 방이 한 칸 좁아졌다.',{light:-2,mind:-8}]}]},
  {t:'벽 속에 사람이 들어 있다. 가슴까지 벽돌이 쌓였다. 아직 숨을 쉰다. 「꺼내 줘.」',o:[
   {l:'벽돌을 빼 준다',s:'str',dc:13,ok:['꺼냈다. 그 사람이 고맙다며 주머니를 털어 준다. 그리고 내가 서 있던 자리에 서서 벽돌을 쌓기 시작한다. 나를 보면서.',{money:40,clue:1,mind:-8}],no:['벽돌이 빠지지 않는다. 그 사람의 손톱이 내 손등을 판다.',{hp:-12,mind:-6}]},
   {l:'못 들은 척한다',s:'nerve',dc:13,ok:['지나쳤다. 등 뒤에서 벽돌 한 장이 더 올라가는 소리.',{mind:-6}],no:['「다음은 너야.」 그 말이 귀에서 떨어지지 않는다.',{mind:-14,fx:'followed'}]}]},
  {t:'새벽 3시도 아닌데 망치 소리가 사방에서 난다. 양쪽 벽이 이쪽으로 밀려온다.',o:[
   {l:'뛴다',s:'agi',dc:13,ok:['벽이 닫히기 직전에 빠져나왔다. 뒤에서 벽 맞붙는 소리.',{}],no:['어깨가 벽에 끼었다. 빼내는 동안 뼈 소리가 났다.',{hp:-16,light:-1}]},
   {l:'방 한가운데 엎드린다',s:'nerve',dc:14,ok:['벽이 몸 바로 앞에서 멈췄다. 망치 소리가 멎고, 벽에 문이 하나 생긴다.',{light:2}],no:['벽이 멈추지 않는다. 등 위로 천장이 내려와 숨이 막힌다. 한참 뒤에야 물러났다.',{hp:-12,mind:-10}]}]}],
 4:[
  {t:'현장 사무실. 출근부에 이름이 빼곡하다. 맨 아래 칸에 내 이름. 출근 시간은 적혀 있고, 퇴근 칸은 비어 있다.',o:[
   {l:'퇴근 칸에 서명한다',s:'nerve',dc:14,ok:['서명했다. 사무실 불이 꺼지고 문이 열린다. 책상 위 봉투를 챙겼다.',{money:60,light:1}],no:['서명하는 손을 누가 잡는다. 「아직이야.」 출근부에 내 이름이 한 줄 더 생긴다.',{mind:-18}]},
   {l:'내 이름 칸을 찢는다',s:'str',dc:14,ok:['찢어서 주머니에 넣었다. 뒷장에 설계도가 비쳐 보인다.',{clue:1,item:'chalk'}],no:['찢는 소리에 바깥 망치 소리가 일제히 멎는다. 그리고 다 같이 문을 두드린다.',{mind:-14,hp:-8}]}]},
  {t:'엘리베이터 통로 공사 중. 통로 아래에서 바람이 올라온다. 바람에 사람 목소리가 섞여 있다.',o:[
   {l:'줄을 타고 내려간다',s:'agi',dc:14,ok:['중간 층 틈에 걸린 버튼 하나. 숫자가 지워져 있다.',{item:'button'}],no:['줄이 끊긴다. 한 층을 떨어졌다. 다리가 이상한 방향으로 꺾였다가 돌아온다.',{hp:-18}]},
   {l:'위에서 소리쳐 본다',s:'talk',dc:13,ok:['「여보세요.」 아래에서 「여보세요.」 내 목소리지만, 어디가 출구인지는 알려 준다.',{light:2}],no:['대답이 없다. 대신 아래에서 무언가 줄을 타고 올라온다.',{mind:-16,light:-2}]}]},
  {t:'천장을 아직 덮지 않은 방. 올려다보면 성채 전체가 거꾸로 매달려 있다.',o:[
   {l:'올려다본다',s:'sen',dc:14,ok:['거꾸로 매달린 성채에서 설계가 보인다. 어디가 어디로 이어지는지.',{clue:2,mind:-6}],no:['거꾸로 매달린 창마다 사람들이 내려다본다. 나를 가리키며 웃는다.',{mind:-20}]},
   {l:'고개를 숙이고 건넌다',r:['고개를 숙인 채 건넜다. 정수리 위에서 누군가 계속 숨을 쉬었다.',{mind:-6}]}]}]},
 f13:{1:[
  {t:'복도 바닥이 다른 층보다 조금 낮다. 발을 디디자 바닥이 물침대처럼 출렁인다.',o:[
   {l:'벽을 짚고 걷는다',s:'agi',dc:11,ok:['벽은 단단했다. 벽에 걸린 소화기 함 안에 양초 한 자루.',{item:'candle'}],no:['짚은 벽도 출렁인다. 벽 안에서 누가 내 손바닥을 마주 짚는다.',{mind:-8}]},
   {l:'바닥을 두드려 본다',s:'sen',dc:11,ok:['두드릴 때마다 아래층에서 같은 박자로 답이 온다. 박자를 따라가니 길이 맞다.',{light:1}],no:['두드리자 바닥 아래에서 내 이름을 부른다.',{mind:-8}]}]},
  {t:'뒤에서 누가 이름을 부른다. 아는 목소리다. 수칙 5번. 13층 복도에서는 뒤를 돌아보지 말 것.',o:[
   {l:'돌아본다',r:['돌아봤다. 아무도 없다. 다시 앞을 보니 복도가 처음부터 다시 시작된다. 목덜미가 차갑다.',{mind:-14,light:-3,fx:'followed'}]},
   {l:'못 들은 척 걷는다',s:'nerve',dc:11,ok:['목소리가 몇 번 더 부르다 멈췄다. 마지막엔 울고 있었다.',{mind:-3}],no:['참았지만 어깨가 움찔했다. 목소리가 웃는다. 「거봐, 듣고 있잖아.」',{mind:-10}]}]},
  {t:'문마다 호수가 붙어 있다. 1301, 1302, 1303, 1305. 1304호가 없다.',o:[
   {l:'1303과 1305 사이 벽을 살핀다',s:'sen',dc:11,ok:['벽지 아래 문틀 흔적. 틈에 열쇠 하나가 끼어 있다.',{item:'key1304'}],no:['벽에 귀를 대니 안에서 텔레비전 소리가 난다. 오늘 아침 내가 본 방송이다.',{mind:-8}]},
   {l:'1303호 문을 두드린다',s:'talk',dc:11,ok:['문이 빼꼼 열리고 손 하나가 사탕을 쥐여 준다. 「1304호는 이사 갔어.」 사탕 포장지 안에 동전이 있다.',{money:10,mind:2}],no:['안에서 대답한다. 「누구세요?」 내 목소리다.',{mind:-10}]}]}],
 2:[
  {t:'복도 끝에 거울. 거울 속 복도가 실제보다 길다. 거울 속 나는 벌써 저 끝에 가 있다.',o:[
   {l:'거울 속 나를 따라 걷는다',s:'nerve',dc:12,ok:['거울 속 나를 따라가니 지름길이다. 거울을 지나칠 때 거울 속 내가 손을 흔들었다.',{light:2}],no:['거울 속 내가 걸음을 멈춘다. 나도 멈춘다. 거울 속 내가 다시 걷기 시작한다. 나는 멈춰 있는데.',{mind:-14,fx:'delirium'}]},
   {l:'거울을 깬다',s:'str',dc:12,ok:['거울이 깨졌다. 조각 하나를 챙겼다. 비친 얼굴이 조금 늦게 따라온다.',{item:'mirror'}],no:['거울은 멀쩡하고 내 주먹만 찢어졌다.',{hp:-10}]}]},
  {t:'복도에 이삿짐 상자가 쌓여 있다. 상자마다 이름. 성채에서 사라진 사람들의 이름이다.',o:[
   {l:'상자를 연다',s:'sen',dc:12,ok:['그 사람의 물건이다. 수첩 하나. 마지막 장에 일곱 자리 번호.',{item:'number',clue:1}],no:['상자 안에서 손이 나와 뚜껑을 도로 닫는다.',{hp:-6,mind:-8}]},
   {l:'이름들을 수첩에 옮겨 적는다',r:['이름들을 옮겨 적었다. 맨 아래 상자에는 아직 테이프가 붙어 있지 않다. 이름 칸에 내 이름.',{mind:-8,clue:1}]}]},
  {t:'누가 복도 끝에서 뒷걸음질로 다가온다. 얼굴을 보이지 않으려는 것 같다.',o:[
   {l:'벽에 붙어 길을 비켜 준다',s:'agi',dc:12,ok:['그 사람이 지나가며 「고마워요.」 목소리가 등 쪽에서 났다. 얼굴이 뒤에 붙어 있었다.',{mind:-6}],no:['미처 비키지 못했다. 등과 등이 부딪쳤다. 그 사람 등은 따뜻하고 축축했다.',{mind:-12,hp:-6}]},
   {l:'나도 뒷걸음질한다',s:'nerve',dc:12,ok:['둘이 등을 맞대고 한참 걸었다. 그 사람이 멈춘 곳에 계단이 있었다.',{light:2,clue:1}],no:['뒷걸음질하다 걸려 넘어졌다. 올려다보니 그 사람 얼굴이 바로 위에 있었다.',{mind:-18}]}]}],
 3:[
  {t:'아까는 없던 1304호 문이 있다. 문 아래로 불빛이 샌다.',o:[
   {l:'1304호 열쇠로 연다',need:'key1304',r:['방 안은 내 방과 똑같다. 책상 위에 내 일기장. 마지막 장은 내일 날짜다. 일기장 사이에 설계도 조각이 끼워져 있다.',{clue:2,mind:-10}]},
   {l:'문을 두드린다',s:'nerve',dc:13,ok:['「나야.」 안에서 대답. 문틈으로 지폐 몇 장이 밀려 나온다.',{money:40}],no:['문이 열리고 내가 나온다. 나는 나를 지나쳐 복도로 걸어간다. 그 뒤로 한동안 내가 둘이었다.',{mind:-16,fx:'delirium'}]},
   {l:'지나친다',r:['지나치는데 문 안쪽에서 의자 끄는 소리. 누가 일어나 문 앞에 선다. 문을 열지는 않았다.',{mind:-4}]}]},
  {t:'복도 형광등이 하나씩 꺼지며 뒤에서 다가온다. 어둠이 따라온다.',o:[
   {l:'뛴다',s:'agi',dc:13,ok:['마지막 형광등 아래로 미끄러져 들어왔다. 등 뒤 어둠이 아쉽다는 듯 멈춘다.',{}],no:['어둠이 발꿈치를 삼켰다. 신발 한 짝을 잃었다. 발이 남아 있어서 다행이다.',{hp:-12,light:-2}]},
   {l:'등불을 높이 든다',r:['등불을 높이 들었다. 어둠이 등불 둘레에서 멈춘다. 대신 심지가 빠르게 줄어든다.',{light:-3}]}]},
  {t:'복도에 누가 앉아 울고 있다. 13층에서 죽은 사람이라고 한다. 어떻게 아냐면, 그 사람이 그렇게 말했다.',o:[
   {l:'옆에 앉아 준다',s:'talk',dc:13,ok:['한참 같이 앉아 있었다. 울음이 그치자 그 사람이 내 손바닥에 무언가 놓고 사라진다. 어금니다.',{item:'molar',clue:1}],no:['옆에 앉자 그 사람이 어깨에 기댄다. 무게가 점점 늘어난다. 일어설 수가 없다.',{hp:-10,mind:-10,light:-1}]},
   {l:'지나간다',s:'nerve',dc:12,ok:['지나쳤다. 울음소리가 한 칸씩 따라오다 멈췄다.',{mind:-4}],no:['지나치는데 울음이 웃음으로 바뀐다.',{mind:-12}]}]}],
 4:[
  {t:'복도 끝 비상구 표시등. 초록색 사람이 달리는 그림이다. 그림 속 사람이 멈춰 서서 나를 본다.',o:[
   {l:'표시등이 가리키는 쪽으로 간다',s:'sen',dc:14,ok:['그림 속 사람이 가리킨 문을 여니 12층 계단참이 내려다보인다. 길을 알았다.',{light:3}],no:['그림 속 사람이 반대로 달리기 시작한다. 따라가다 보니 처음 자리다.',{light:-3,mind:-8}]},
   {l:'표시등을 깬다',s:'str',dc:14,ok:['깨진 표시등 안에 접힌 쪽지와 지폐.',{money:30,clue:1}],no:['깨는 순간 복도의 모든 문이 동시에 열린다. 문마다 사람이 서 있다.',{mind:-20}]}]},
  {t:'누가 뒤에서 어깨를 세 번 두드린다. 그리고 귀에 대고 속삭인다. 「돌아봐도 돼. 이번엔 괜찮아.」',o:[
   {l:'돌아본다',r:['돌아봤다. 아주 가까이에 얼굴이 있었다. 그 뒤로 기억이 없다. 정신을 차리니 복도 바닥에 엎드려 있고, 입안에 흙이 가득하다.',{hp:-15,mind:-20,light:-3,fx:'delirium'}]},
   {l:'그대로 걷는다',s:'nerve',dc:14,ok:['그대로 걸었다. 두드림이 등을 타고 내려가 발목에서 멈췄다. 「아깝다.」',{mind:-4,clue:1}],no:['걸었지만 고개가 저절로 반쯤 돌아갔다. 목에서 뚝 소리. 끝까지 돌아가지는 않았다.',{hp:-12,mind:-12}]}]},
  {t:'13층 복도 한가운데 엘리베이터가 서 있다. 성채에 엘리베이터는 없다. 문이 열려 있다.',o:[
   {l:'탄다',r:['탔다. 버튼은 하나뿐이다. 누르자 문이 닫히고 한참 내려간다. 열린 곳은 같은 13층이다. 등불이 많이 줄어 있다.',{light:-4,clue:1}]},
   {l:'버튼만 뜯어 간다',s:'agi',dc:14,ok:['숫자가 지워진 버튼을 뜯었다.',{item:'button'}],no:['손을 넣는 순간 문이 닫혔다. 손가락 사이에 문이 꽉 물렸다.',{hp:-16}]},
   {l:'지나친다',r:['지나치자 문이 닫히는 소리. 위로 올라가는 소리. 이 위에 층은 없다.',{mind:-6}]}]}]},
 drain:{1:[
  {t:'사다리 끝, 물이 정강이까지 찬다. 물이 미지근하다. 사람 체온 정도.',o:[
   {l:'물을 떠서 마셔 본다',r:['수칙 8번을 어겼다. 물맛이 짜다. 눈물 맛이다. 이상하게 힘은 난다.',{mind:-8,hp:4}]},
   {l:'물살을 거슬러 걷는다',s:'str',dc:11,ok:['물살 속에 걸린 동전 몇 개를 주웠다.',{money:15}],no:['미끄러져 넘어졌다. 물속에서 누가 내 머리를 쓰다듬었다.',{hp:-6,mind:-6}]}]},
  {t:'벽에 수위 표시가 그어져 있다. 표시마다 날짜와 이름. 가장 높은 표시는 내 키보다 높다.',o:[
   {l:'이름을 읽는다',s:'sen',dc:11,ok:['아는 이름이 하나 있다. 그 옆에 「찾지 마」. 표시선에 반지 하나가 박혀 있다.',{item:'drainring'}],no:['읽는 동안 물이 한 칸 올랐다.',{light:-2}]},
   {l:'벽 틈을 뒤진다',r:['벽 틈에 누가 숨겨 둔 양초가 있다. 심지가 젖지 않았다.',{item:'candle'}]}]},
  {t:'물 위로 종이배가 떠내려온다. 종이배 안에 작은 불이 켜져 있다.',o:[
   {l:'종이배를 건진다',s:'agi',dc:11,ok:['펼쳐 보니 손으로 그린 수로 지도다.',{light:2,clue:1}],no:['종이배를 잡자 불이 손으로 옮겨붙는다. 물에 담가도 한참 탄다.',{hp:-8}]},
   {l:'종이배를 따라간다',r:['종이배를 따라가니 갈림길마다 작은 불빛이 남아 있다. 누가 앞서 간 것 같다.',{light:1,mind:-3}]}]}],
 2:[
  {t:'물속에 사람들이 서 있다. 머리끝까지 잠겨 있다. 다들 위를 본다. 숨 쉬는 기포가 없다.',o:[
   {l:'사이를 지나간다',s:'nerve',dc:12,ok:['아무도 움직이지 않았다. 마지막 사람 손에서 지폐 한 장이 떠올랐다.',{money:30}],no:['한 사람이 손을 뻗어 발목을 잡는다. 물속으로 끌려 들어갔다가 겨우 올라왔다.',{hp:-12,mind:-8}]},
   {l:'한 사람을 끌어 올린다',s:'str',dc:12,ok:['끌어 올렸다. 숨을 크게 쉰다. 「고마워. 근데 나 원래 여기 살아.」 내 손에 무언가 쥐여 주고 다시 들어간다.',{clue:1,mind:-4}],no:['끌어 올린 건 옷뿐이다. 안이 비어 있다. 젖은 옷이 내 몸에 감긴다.',{hp:-8,mind:-10}]}]},
  {t:'수로 벽에 문이 하나. 문 아래로 물이 새어 들어간다. 안에서 목욕물 받는 소리.',o:[
   {l:'문을 연다',s:'nerve',dc:12,ok:['목욕탕이다. 탕 안에 아무도 없다. 탈의실 사물함에 지갑이 하나.',{money:35}],no:['탕 안에 누가 앉아 있다. 「문 닫아. 물 식어.」 문을 닫고 나오니 바깥 수위가 올라 있다.',{light:-2,mind:-8}]},
   {l:'지나간다',r:['지나치는데 문 안에서 누가 부른다. 「같이 씻고 가.」',{mind:-4}]}]},
  {t:'물이 갑자기 빠진다. 바닥에서 물고기 대신 손들이 퍼덕인다.',o:[
   {l:'손을 피해 뛴다',s:'agi',dc:12,ok:['손들 사이를 빠져나왔다.',{}],no:['손 하나가 신발 끈을 잡았다. 끈을 풀고 신발을 두고 왔다.',{hp:-6,light:-1}]},
   {l:'손들을 웅덩이에 놓아 준다',s:'sen',dc:12,ok:['손을 하나씩 웅덩이에 넣어 주었다. 마지막 손이 손가락으로 길을 가리켰다.',{light:2,clue:1}],no:['집어 든 손이 내 손을 놓지 않는다. 한참 걸려 떼어 냈다.',{hp:-8,mind:-10}]}]}],
 3:[
  {t:'바깥으로 이어지는 쇠창살. 창살 너머로 성채 밖 거리가 보인다. 버스가 지나간다. 누가 손을 흔든다. 우리 엄마다.',o:[
   {l:'창살을 붙잡고 부른다',r:['불렀다. 엄마가 고개를 갸웃한다. 입 모양으로 「누구세요.」 버스가 지나가고, 거리는 그냥 벽이 된다.',{mind:-18,clue:1}]},
   {l:'등을 돌린다',s:'nerve',dc:13,ok:['등을 돌렸다. 내 이름이 몇 번 불리다 그쳤다.',{mind:-6}],no:['돌아섰지만 귀는 막을 수 없었다. 마지막에 불린 건 성채에 오기 전 쓰던 이름이었다.',{mind:-16,fx:'delirium'}]}]},
  {t:'물이 허리까지 찬다. 어딘가 수문이 열린 것 같다. 물이 빠르게 오른다.',o:[
   {l:'위쪽 배관을 잡고 오른다',s:'str',dc:13,ok:['배관 위로 올라섰다. 물이 발밑에서 멈춘다.',{}],no:['녹슨 배관이 부러졌다. 물을 많이 먹었다.',{hp:-16,light:-2}]},
   {l:'물살을 거슬러 헤엄친다',s:'agi',dc:13,ok:['수문까지 헤엄쳤다. 손잡이에 걸린 봉투를 챙겼다.',{money:40,clue:1}],no:['물살에 떠밀려 한참 뒤로 갔다.',{light:-3,hp:-8}]}]},
  {t:'물 위에 사람 하나가 엎드려 떠 있다. 옷이 내 옷과 같다.',o:[
   {l:'뒤집어 본다',s:'nerve',dc:13,ok:['마네킹이다. 주머니에 쪽지. 「다음엔 진짜야.」',{clue:1,mind:-8}],no:['뒤집으니 나다. 눈을 뜬다. 「왜 깨워.」',{mind:-20,fx:'delirium'}]},
   {l:'건드리지 않는다',r:['건드리지 않고 지나쳤다. 한참 뒤 돌아보니 그게 내 뒤를 따라 떠내려오고 있다.',{mind:-8,fx:'followed'}]}]}],
 4:[
  {t:'앞쪽 물이 끓고 있다. 수칙 8번. 수로의 물은 반드시 끓여 마실 것. 이 물은 누가 끓인 걸까.',o:[
   {l:'디딤돌을 밟고 건넌다',s:'agi',dc:14,ok:['건넜다. 발바닥이 뜨거웠을 뿐이다.',{hp:-4}],no:['디딤돌이 가라앉았다. 다리가 끓는 물에 잠긴다.',{hp:-20}]},
   {l:'물이 식기를 기다린다',r:['기다렸다. 물이 식는 동안 등불이 꽤 줄었다. 식은 물 바닥에 하얀 뼈들이 가지런하다. 뼈 사이에 설계도 조각.',{light:-3,clue:1}]}]},
  {t:'둥근 방. 사방 벽에 성채의 배수구가 뚫려 있다. 구멍마다 성채 사람들 목소리가 흘러나온다.',o:[
   {l:'아는 목소리를 찾는다',s:'sen',dc:14,ok:['지인의 목소리다. 별 얘기는 아니다. 저녁 뭐 먹지. 그 목소리가 나는 배관을 따라 길을 찾았다.',{light:3}],no:['모든 구멍에서 동시에 내 목소리가 난다. 다 다른 얘기를 하고 있다.',{mind:-20}]},
   {l:'구멍 하나에 대고 말한다',s:'talk',dc:13,ok:['「거기 누구 있어요.」 위에서 누가 대답하고 줄을 내려 준다. 줄 끝에 봉투.',{money:60}],no:['구멍에서 젖은 손이 나와 내 입을 막는다.',{hp:-10,mind:-10}]}]},
  {t:'물속에서 무언가 거대한 것이 지나간다. 물결이 무릎을 친다. 내가 숨을 쉴 때마다 그것도 숨을 쉰다.',o:[
   {l:'숨을 참는다',s:'nerve',dc:14,ok:['숨을 참는 동안 그것이 지나갔다. 꼬리 끝에 걸려 있던 반지 하나가 떨어졌다.',{item:'drainring',clue:1}],no:['숨이 터졌다. 그것이 멈춘다. 그리고 돌아온다.',{hp:-18,mind:-14}]},
   {l:'벽에 바짝 붙는다',s:'agi',dc:13,ok:['벽에 붙어 있는 동안 물결만 몇 번 지나갔다.',{mind:-6}],no:['벽에 붙은 등을 무언가 길게 핥고 지나갔다.',{mind:-16,hp:-6}]}]}]}};

const DEEP_FINAL={
 build:{n:'설계실',t:'복도 끝 문에 「설계실 · 관계자 외 출입 금지」. 안에서 연필 깎는 소리가 난다.\n책상 앞에 누가 등을 돌리고 앉아 있다. 뒷모습이 낯익다. 성채를 설계한 사람이다. 아니면 그 사람이 되어 버린 누군가.',o:[
  {l:'설계도를 보여 달라고 한다',s:'talk',dc:14,ok:['그 사람이 돌아보지 않은 채 설계도 묶음을 밀어 준다. 「다 가져가. 어차피 내일이면 또 바뀌어.」\n책상 위 몽당연필도 챙겼다. 나올 때까지 연필 깎는 소리가 이어졌다.',{clue:2,item:'pencil',money:80}],no:['그 사람이 돌아본다. 얼굴 자리에 설계도가 붙어 있다. 거기 내 방이 그려져 있다. 지우개로 지운 자국과 함께.\n정신없이 뛰어나왔다. 손에 설계도 한 장만 구겨져 있다.',{clue:1,mind:-20,hp:-10}]},
  {l:'몰래 연필을 집는다',s:'agi',dc:14,ok:['연필을 집었다. 그 사람은 연필이 사라진 줄도 모르고 빈손으로 계속 선을 긋는다. 종이 위에 선이 그어진다.\n나오는 길에 책상 서랍에서 설계도도 몇 장 챙겼다.',{clue:2,item:'pencil',money:40}],no:['손이 닿기 직전 그 사람이 연필로 내 손등을 찍는다. 「남의 거 만지지 마.」\n손등에 박힌 흑연이 빠지지 않는다.',{hp:-14,mind:-14,clue:1}]}]},
 f13:{n:'1313호',t:'복도 맨 끝, 호수판에 1313. 문이 반쯤 열려 있다.\n안에서 사람들이 생일 노래를 부른다. 케이크 위에 초가 꽂혀 있고, 딱 한 자리만 비어 있다. 다들 나를 보며 박수를 친다. 내 자리다.',o:[
  {l:'빈 자리에 초를 꽂고 불을 붙인다',s:'nerve',dc:14,ok:['불을 붙였다. 노래가 멎고 모두가 박수를 친다. 손뼉 소리가 아주 오래 이어진다.\n정신을 차리니 계단참이다. 손에 열쇠 하나가 쥐여 있다. 열쇠고리에 「13」.',{clue:2,item:'key13',money:80}],no:['불이 붙지 않는다. 박수가 멎는다. 다들 웃는 얼굴 그대로 천천히 일어선다.\n어떻게 빠져나왔는지 모르겠다. 입안에 케이크 맛이 남아 있다. 먹은 기억이 없다.',{clue:1,mind:-22}]},
  {l:'케이크를 엎고 뛴다',s:'agi',dc:14,ok:['케이크를 엎었다. 사람들이 바닥에 쏟아진 크림을 주우려 엎드린 사이 빠져나왔다. 문틀에 걸려 있던 열쇠를 낚아챘다.',{clue:1,item:'key13',money:40}],no:['케이크를 엎으려는 손을 누가 잡는다. 「생일인데 왜 그래.」 손목에 손가락 자국이 남았다.',{hp:-16,mind:-12,clue:1}]}]},
 drain:{n:'물이 시작되는 곳',t:'수로의 끝은 둥근 우물 바닥이다. 아주 높이, 작은 하늘이 보인다.\n우물 벽에 성채 사람들의 신발이 빼곡히 걸려 있다. 물 가운데 젖은 아이 하나가 앉아 있다. 「내 신발 찾았어?」',o:[
  {l:'벽에서 맞는 신발을 찾아 준다',s:'sen',dc:14,ok:['아이가 신발을 신고 일어선다. 「이제 집에 갈 수 있다.」\n아이가 앉아 있던 자리에 구슬 하나가 남아 있다. 눈동자 같다. 집어 들자 나를 본다.',{clue:2,item:'pearl',money:60}],no:['아이가 신발을 신어 보고 고개를 젓는다. 「이거 네 거잖아.」\n내려다보니 내가 맨발이다. 언제 벗었는지 모르겠다.',{hp:-12,mind:-14,clue:1}]},
  {l:'아이를 업고 사다리를 오른다',s:'str',dc:14,ok:['아이를 업고 올랐다. 점점 무거워진다. 꼭대기에 닿자 등이 가벼워졌다. 목덜미에 구슬 하나가 떨어져 있다.',{clue:2,item:'pearl',money:40}],no:['중간에서 손이 미끄러졌다. 아이가 귀에 대고 말한다. 「다음에 또 와.」 둘 다 물속으로 떨어졌다.',{hp:-18,mind:-10,clue:1}]}]}};

const DEEP_AMB={
 1:['어디선가 물 떨어지는 소리가 일정하게 난다. 세어 보니 내 맥박과 같다. 숨을 멈추자 물소리도 멈춘다.','등불 그림자가 벽에 두 개 생긴다. 하나는 조금 늦게 움직이고, 내가 멈춰도 한 걸음 더 걷는다.','벽 너머에서 누가 밥을 먹는다. 숟가락이 그릇 바닥을 긁는 소리가 오래 이어진다. 그릇은 진작 비었는데.','바닥에 머리카락 한 올이 길게 떨어져 있다. 따라가 보면 끝이 내 뒷머리에 닿아 있다.','멀리서 라디오 소리. 내가 좋아하던 노래인데 가사가 조금 다르다. 가사에 내 이름이 나온다.','공기가 눅눅하다. 들이쉴 때마다 남이 방금 내쉰 숨 냄새가 난다. 바로 뒤에서.','벽에 키를 잰 연필 자국이 있다. 날짜가 지날수록 키가 줄어든다. 맨 아래 자국은 바닥에 붙어 있다.','문 앞마다 신발이 한 켤레씩 놓여 있다. 전부 안쪽을 향해 벗어 두었다. 들어간 사람은 있는데 나온 사람은 없다.','등불을 비추자 벽에 걸린 거울이 한 박자 늦게 밝아진다.','어디선가 아이가 숫자를 센다. 「…열여덟, 열아홉.」 스물은 끝내 들리지 않는다.'],
 2:['벽지가 군데군데 부풀어 있다. 누르면 안에서 무언가 꿈틀하며 자리를 옮긴다. 손을 떼자 손바닥 모양대로 벽지가 쑥 들어가 있다.','바닥 타일 틈마다 손톱이 하나씩 박혀 있다. 반달이 다 위를 본다. 몇 개에는 매니큐어가 칠해져 있다.','천장에서 무언가 떨어져 어깨에 닿는다. 따뜻하고 끈적하다. 올려다보지 않았다. 위에서 누가 입맛을 다셨다.','복도 끝에서 누가 이를 간다. 소리가 점점 가까워지는데 발소리는 없다. 이 가는 소리가 바로 귀 옆에서 멈춘다.','벽이 사람 피부처럼 따뜻하다. 손을 떼려는데 벽이 손바닥에 살짝 달라붙었다 떨어진다.','등불 아래 내 손등의 핏줄이 평소보다 많다. 그중 하나가 손목 쪽으로 천천히 기어간다.','닫힌 문 너머에서 누가 내 목소리로 말한다. 「응, 지금 가.」 나는 아무 말도 하지 않았다.','계단참에 가족사진 액자가 줄지어 걸려 있다. 사진마다 한 사람 얼굴만 손톱으로 긁혀 있다. 긁힌 자국이 아직 하얗다.','내 발소리가 한 번 더 난다. 왼발, 오른발, 그리고 하나 더.','등 뒤 공기가 조금 따뜻하다. 누가 바짝 붙어 서 있을 때의 온도다.'],
 3:['벽에서 진물이 흘러내린다. 고기 썩는 냄새와 젖은 머리카락 냄새가 엉겨 있다. 진물에 작은 이빨들이 섞여 굴러떨어진다.','바닥이 물렁하다. 바닥재 아래로 갈비뼈가 비친다. 밟을 때마다 바닥이 숨을 내쉬고, 틈새로 미지근한 바람이 발목을 핥는다.','형광등 자리에 눈알이 박혀 깜빡인다. 눈꺼풀이 없어서 흰자가 바싹 말라 갈라졌고, 갈라진 틈마다 피가 맺혀 있다.','문고리마다 사람 이가 촘촘히 박혀 있다. 잡으면 이가 손바닥을 문다. 맛보듯이 살짝. 놓으면 침이 실처럼 늘어진다.','벽 틈에서 손가락들이 자라 나와 있다. 마디마다 손톱이 하나씩 더 붙어 있고, 지나갈 때마다 옷자락을 붙잡으려 오므린다.','공기에서 피 맛이 난다. 입이 아니라 눈에서. 깜빡일 때마다 시야가 한 겹씩 붉어진다.','바닥이 젖어 있다. 물이 아니다. 발바닥을 끈적하게 붙잡았다가 쩍 소리를 내며 놓아준다. 떨어질 때 발바닥 살갗이 조금 딸려 간다.','천장 모서리에 누가 거미처럼 붙어 있다. 팔다리가 하나씩 더 많다. 목이 반대로 꺾인 채 나를 내려다보며 따라 기어 온다.','복도 한쪽에 벗겨 낸 사람 얼굴이 빨래처럼 널려 있다. 눈구멍으로 바람이 지나가며 휘파람 소리를 낸다.'],

function deepPool(sp,tier){return[...DR.all[tier].map((r,i)=>'all.'+tier+'.'+i),...DR[sp][tier].map((r,i)=>sp+'.'+tier+'.'+i)]}

function deepSeq(sp){const seq=[];const cnt={1:5,2:5,3:5,4:4};for(const t of[1,2,3,4]){const p=deepPool(sp,t).sort(()=>Math.random()-.5);seq.push(...p.slice(0,cnt[t]))}return seq}
function deepHas(k){const d=G.me.deep;return(d&&(d.pocket.items[k]||0)>0)||(G.me.items[k]||0)>0}
function deepUse(k){const d=G.me.deep;if((d.pocket.items[k]||0)>0)d.pocket.items[k]--;else if((G.me.items[k]||0)>0)G.me.items[k]--}
function deepPocketTxt(pk){const a=[];if(pk.money)a.push('$'+pk.money);if(pk.clue)a.push('설계도 조각 '+pk.clue);for(const k in pk.items)if(pk.items[k]>0)a.push(`${toyName(k)}${pk.items[k]>1?' ×'+pk.items[k]:''}`);return a.length?a.join(', '):'비어 있음'}
function deepApply(rw){const m=G.me,d=m.deep,out=[];if(!rw)return out;

function corruptText(v){const m=G.me;if(!m||!hasFx('corrupt')||!v)return v;const lv=Math.min(3,m.corrLv||1),p=[0,.1,.2,.35][lv];let inAct=false,out='',hit=0;
  for(const ch of v){if(ch==='*'){inAct=!inAct;out+=ch;continue}if(!inAct&&!/[\s.,!?~…「」]/.test(ch)&&chance(p)){out+='□';hit++}else out+=ch}
  if(!hit){const i=[...v].findIndex(c=>/[가-힣A-Za-z0-9]/.test(c));if(i>=0){const a=[...v];a[i]='□';out=a.join('')}}

 {n:'간판 없는 상점가',zh:'市',d:'무명동 골목. 날마다 다른 가게 두 곳이 문을 연다. 값은 돈으로 받지 않는다.',rooms:['정육점 같은 가게와 치과 같은 가게가 열었다. 둘 다 같은 냄새가 난다. 쇠 냄새와 단 냄새.','이발소와 사진관이 열었다. 이발소 바닥의 머리카락이 사진관 쪽으로 기어간다.','국숫집과 문방구가 열었다. 국수 그릇이 네 개씩 놓여 있고, 네 번째 그릇에만 국물이 붉다.','셔터가 반만 열린 가게 두 곳이다. 셔터 아래로 맨발들이 줄지어 서 있다. 발톱이 하나도 없다.','약국과 전당포가 열었다. 전당포 진열장에 사람 이름이 적힌 유리병이 늘어서 있다. 병 안에서 무언가가 바닥을 긁는다.','재봉소와 정육점이 열었다. 재봉틀에 걸린 건 천이 아니라 손바닥만 하게 잘린 가죽이다. 점이 있다. 누군가의 점이다.','사진관 진열창에 영정 사진이 걸려 있다. 맨 끝 한 장은 아직 현상 중이고, 윤곽이 점점 나를 닮아 간다.','약국과 이발소가 열었다. 약병마다 손톱이 담겨 있고, 이발 의자 아래엔 두피째 벗겨진 머리카락이 쌓여 있다.','국숫집 하나만 열었다. 손님들이 고개를 숙이고 먹는다. 그릇 속 면발이 꿈틀거린다. 아무도 씹지 않는다.','간판 없는 노점이다. 꼬치에 꿰인 것이 고기인지 손가락인지, 마디가 있다. 주인이 하나 권한다.'],soft:['정육점 같은 가게와 치과 같은 가게가 열었다.','이발소와 사진관이 열었다.','약국과 전당포가 열었다. 진열장에 이름이 적힌 병이 늘어서 있다.','사진관 진열창에 영정 사진이 걸려 있다. 맨 끝 한 장은 아직 현상 중이다.','국숫집 하나만 열었다. 손님들이 고개를 숙이고 먹는다.'],warn:'값은 돈으로 받지 않는다. 무엇을 내는지 끝까지 읽을 것.'},
 {n:'물 없는 수로',zh:'渠',d:'무명동 지하. 물이 흘러야 할 자리에 다른 것이 흐른다.',rooms:['말라 버린 수로다. 바닥에 물 대신 사람 이가 자갈처럼 깔려 있다. 밟을 때마다 바스락거린다.','물이 거꾸로 흐르는 수로다. 물이 천장으로 흘러 올라가 고이고, 고인 물에 얼굴들이 떠 있다. 다들 입을 벌리고 있다.','배가 멈춘 부두다. 배 안에 노 젓는 사람들이 앉아 있다. 손바닥이 노에 실로 꿰매져 있다.','하얀 김이 찬 수로다. 김 너머에서 누가 「바깥 이름」을 부른다.','벽돌로 막힌 수로 끝이다. 벽돌 틈으로 하얀 것이 천천히 스며 나온다.','수로 벽에 사람이 한 줄로 박혀 있다. 벽돌처럼. 얼굴만 밖으로 나와 숨을 쉰다. 한 사람이 내 이름을 안다.','부두에 그물이 널려 있다. 걸려 있는 건 물고기가 아니라 머리카락 뭉치와 이름표들이다.','수문이 반쯤 열려 있다. 그 틈으로 하얀 손들이 안개처럼 흘러 들어와 바닥을 더듬는다. 발목을 찾고 있다.','배수관 끝에서 물 대신 피가 똑, 똑 떨어진다. 떨어지는 박자가 내 맥박과 같다.','수로 바닥에 아이 신발이 수십 켤레 줄지어 있다. 전부 바깥쪽을 향하고 있다.'],soft:['말라 버린 수로다. 바닥에 자갈이 깔려 있다.','물이 거꾸로 흐르는 수로다.','하얀 김이 찬 수로다. 김 너머에서 누가 이름을 부른다.','부두에 그물이 널려 있다. 이름표들이 걸려 있다.','수로 바닥에 아이 신발이 줄지어 있다. 전부 바깥쪽을 향하고 있다.'],warn:'바깥 이름을 부르는 소리에 대답하지 말 것.'}];
function mmdRoom(t,day){const T0=MMD_T[t];const pool=G.opts&&G.opts.soft?T0.soft:T0.rooms;const r=rng((day==null?dayIdx(T()):day)*131+t*17);return pool[Math.floor(r()*pool.length)]}
const MMD_R=4,MMD_PH=9;
const mmdKey=(t,r)=>`4-${t}-${r}`;
function mmdLabel(t,r){if(r===MMD_PH)return['옥상 □','9□□호','5□□호','1□□호','B□'][t];return t===0?`옥상 ${r+1}`:t===4?`B${r+1}`:`${[0,9,5,1][t]}0${r+1}호`}
const MMD_LAYOUT={};
function mmdLayout(day){day=day==null?dayIdx(T()):day;if(MMD_LAYOUT[day])return MMD_LAYOUT[day];const r=rng(day*977+3);const st={};for(let t=0;t<5;t++)for(let i=0;i<MMD_R;i++)st[mmdKey(t,i)]='ok';
  const left=t=>[...Array(MMD_R).keys()].filter(j=>st[mmdKey(t,j)]!=='gone').length;
  let gone=0,tries=0;while(gone<3&&tries<80){tries++;const t=Math.floor(r()*5),i=Math.floor(r()*MMD_R),k=mmdKey(t,i);if(st[k]==='ok'&&left(t)>2){st[k]='gone';gone++}}
  let ex=0;tries=0;while(ex<2&&tries<80){tries++;const k=mmdKey(Math.floor(r()*5),Math.floor(r()*MMD_R));if(st[k]==='ok'){st[k]='extra';ex++}}
  const ph=r()<.4?Math.floor(r()*5):-1;const host={};
  [[1,'mmdroom'],[2,'mmddesk'],[3,'mmdshop']].forEach(([t,p])=>{const ok=[...Array(MMD_R).keys()].filter(j=>st[mmdKey(t,j)]!=='gone');host[mmdKey(t,ok[Math.floor(r()*ok.length)])]=p});
  return MMD_LAYOUT[day]={st,ph,host}}
function mmdParse(k){const a=String(k).split('-').map(Number);return{t:a[1],r:a[2]}}
function mmdExists(k){if(!isMMD(k))return true;const{t,r}=mmdParse(k);if(isNaN(r))return false;const L=mmdLayout();if(r===MMD_PH)return L.ph===t;return L.st[k]!=='gone'}
function mmdState(k){const{r}=mmdParse(k);if(r===MMD_PH)return'phantom';return mmdLayout().st[k]||'ok'}
function mmdRoomOf(k,day){const{t,r}=mmdParse(k);const T0=MMD_T[t];const pool=G.opts&&G.opts.soft?T0.soft:T0.rooms;const rr=rng((day==null?dayIdx(T()):day)*131+t*17);const idx=[...pool.keys()];for(let i=idx.length-1;i>0;i--){const j=Math.floor(rr()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}const slot=r===MMD_PH?4:(r||0);return pool[idx[slot%idx.length]]}
for(let t=0;t<5;t++)for(const i of[0,1,2,3,MMD_PH]){const k=mmdKey(t,i);CELLS[k]={get n(){return MMD_T[t].n+' · '+mmdLabel(t,i)},get p(){const h0=mmdLayout().host[k];return h0?[h0]:[]},
  get d(){const s=mmdState(k);return MMD_T[t].d+(i===MMD_PH?' 어제는 없던 방이다. 번호 칸이 비어 있다.':'')+' 오늘은 이렇다. '+mmdRoomOf(k)+(s==='extra'?' 이 방엔 문이 하나 더 있다. 들어온 문이 어느 쪽이었는지 헷갈린다.':'')}}}
function mmdFloorKeys(t,all){return[0,1,2,3,MMD_PH].map(i=>mmdKey(t,i)).filter(k=>all||mmdExists(k))}
function mmdAllKeys(){const o=[];for(let t=0;t<5;t++)o.push(...mmdFloorKeys(t));return o}
function chCell(k){if(isMMD(k)){const{t}=mmdParse(k);return'4-'+t}return k}
function mmdGoneYesterday(t){const y=mmdLayout(dayIdx(T())-1),n=mmdLayout();return[0,1,2,3].filter(i=>{const k=mmdKey(t,i);return y.st[k]!=='gone'&&n.st[k]==='gone'}).map(i=>mmdLabel(t,i))}
function mmdFix(k){if(isMMD(k)&&isNaN(mmdParse(k).r)){const t=mmdParse(k).t;return mmdFloorKeys(t)[0]}return k}
/* 엘리베이터 같은 무작위 이동이 무명동으로 떨어지지 않게 */
function mmdKeysOut(){return Object.keys(CELLS).filter(k=>!isMMD(k))}

/* 결과 처리: corr(괴이화) · blur(이름 흐림) · hide(숨은 수칙) · dup(방 물건 복제) */
function mmdGive(rw){rw=Object.assign({},rw||{});const ex=[];const c=rw.corr,b=rw.blur,hd=rw.hide,dp=rw.dup,f2=rw.fx2;delete rw.corr;delete rw.blur;delete rw.hide;delete rw.dup;delete rw.fx2;
  if(G.me&&G.me.cell&&isMMD(G.me.cell)){const st=mmdState(G.me.cell);const mul=st==='extra'||st==='phantom'?3:2;if(rw.money>0)rw.money*=mul;if(rw.clue>0)rw.clue*=mul}
  const out=give(rw);if(f2&&typeof fxGain==='function'&&FXDEF[f2]){fxGain(f2,'');out.push(FXDEF[f2].n)}if(c&&typeof corruptUp==='function'){corruptUp('');out.push('괴이화')}if(b&&typeof fxGain==='function'){fxGain('blur','');out.push('이름 흐림')}if(hd&&discover(hd))out.push('숨은 수칙');
  if(dp){const rm=G.me.room||[];const k=rm.length?pick(rm):null;if(k&&ITEMS[k]){G.me.items[k]=(G.me.items[k]||0)+1;out.push(`밤물건 「${ITEMS[k].n}」`)}else if(k&&typeof TOYS!=='undefined'&&TOYS[k]){G.me.toys=G.me.toys||{};G.me.toys[k]=(G.me.toys[k]||0)+1;out.push(`장난감 「${TOYS[k].n}」`)}}
  return out}
function mmdScene(id,title,ev){const m=G.me;const text=G.opts&&G.opts.soft&&ev.soft?ev.soft:ev.t;
  openScene({id,dexKey:'mmd:'+id.replace('mmd_',''),title,red:true,text,choices:ev.o.map(o=>({l:o.l,s:o.s,run:()=>{let ok=true,ct='';if(o.s){const c=chk(o.s,o.dc);ok=c.ok;ct=c.txt}
    const res=o.r||(ok?o.ok:o.no);const out=mmdGive(res[1]);if(ct)out.unshift(ct);const bad=!o.r&&!ok;const sid=id.replace('mmd_','');const ci=ev.o.indexOf(o);const sk=`${sid}.${ci}.${o.r?'r':ok?'ok':'no'}`;const txt=G.opts&&G.opts.soft&&typeof MMD_SOFT!=='undefined'&&MMD_SOFT[sk]?MMD_SOFT[sk]:res[0];
    try{dexAdd('mmd:'+sid)}catch(e){}log(`무명동 · ${title}: ${txt.split('\n')[0].slice(0,40)}…`,'haunt');
    done(`무명동 · ${title}`,txt,out,bad||!!(res[1]&&res[1].corr))}}))})}

 [{id:'shirt',n:'줄에 걸린 셔츠',t:'줄에 걸린 셔츠 하나가 꼭 내 치수다. 소매 끝이 축축하다. 셔츠 안쪽에서 손가락 같은 것이 단추를 하나씩, 아래에서부터 채우고 있다.',soft:'줄에 걸린 셔츠 하나가 꼭 내 치수다. 셔츠 안쪽에서 누가 단추를 채우고 있다.',
   o:[{l:'셔츠를 걷는다',s:'str',dc:10,ok:['단추를 뜯어내자 셔츠 안은 비어 있었다. 가슴 주머니에 설계도 조각이 접혀 있다.\n손가락은 어디로 갔는지 모른다. 내 등 뒤에서 단추 채우는 소리가 났다.',{clue:1,mind:-4}],no:['셔츠가 먼저 내 손목을 잡았다. 소매 속에서 손톱이 살갗을 파고든다.\n겨우 뿌리치니 손목에 단추 모양 자국이 다섯 개 남았다. 자국마다 실밥이 박혀 있다.',{hp:-15,mind:-8}]},

   o:[{l:'팔을 휘저어 쫓아낸다',s:'nerve',dc:12,ok:['비둘기들이 흩어졌다. 바닥에는 빈 외투 한 벌뿐이다. 주머니에서 지갑이 나왔다. 주인 이름 칸은 비어 있다.',{money:40,mind:-6}],no:['비둘기들이 이번엔 나를 둘러쌌다. 부리가 손등과 귀를 쪼았다. 겨우 빠져나오니 반지 낀 비둘기가 내 손가락을 재듯이 보고 있었다.',{hp:-14,mind:-8}]},
     {l:'모이를 뿌려 준다',r:['비둘기들이 모이로 몰려간 사이, 한 마리가 무언가를 물어 와 내 발치에 떨어뜨렸다. 동전이다. 아직 따뜻하다.',{money:10,mind:-5}]}]},
  {id:'tank',n:'물탱크',t:'옥상 물탱크 뚜껑이 열려 있다. 수면 위로 거품이 올라온다. 일정하게. 누가 안에서 숨을 참고 있다.',soft:'옥상 물탱크 뚜껑이 열려 있다. 수면 위로 거품이 올라온다. 일정하게.',
   o:[{l:'들여다본다',s:'sen',dc:11,ok:['물이 맑다. 바닥에 동전과 젖은 종이가 깔려 있다. 건져 낸 종이는 설계도 조각이었다. 거품은 그새 멎어 있었다.',{clue:1,money:20,mind:-6,fx2:'wetprint'}],no:['물속에서 손이 올라와 내 뒤통수를 눌렀다. 차가운 물이 코와 입으로 밀려든다. 놓아준 건 숨이 끊기기 직전이었다. 「다음엔 네 차례야.」',{hp:-15,mind:-10,fx2:'wetprint'}]},
     {l:'뚜껑을 닫는다',r:['뚜껑을 닫자 안쪽에서 두드리는 소리가 났다. 세 번. 쉬고. 세 번. 나는 끝까지 열어 주지 않았다.',{mind:-5}]}]}],
 /* 1 상층 · 누군가의 집들 */
 [{id:'nameplate',n:'내 이름이 걸린 집',t:'문패에 내 이름이 적혀 있다. 문 안쪽에서 누가 부른다. 「왔니? 밥 먹어.」 아는 목소리다. 그 목소리의 주인은 성채에 온 적이 없다.',soft:'문패에 내 이름이 적혀 있다. 문 안쪽에서 누가 부른다. 「왔니? 밥 먹어.」 아는 목소리다.',
   o:[{l:'들어간다',s:'nerve',dc:12,ok:['식탁에 내 어릴 적 사진이 엎어져 있다. 뒤집으니 사진 뒷면에 설계도 조각이 붙어 있었다. 목소리는 끝까지 얼굴을 보여 주지 않았다.',{clue:1,mind:-7}],no:['「너 아니잖아.」\n문이 세게 닫혔다. 문틈에 끼인 손가락 끝에서 손톱이 들려 올라갔다.',{hp:-12,mind:-10,fx2:'nails'}]},

  {id:'peephole',n:'외시경',t:'복도의 모든 문 외시경에서 눈이 나를 보고 있다. 눈꺼풀이 없다. 문 하나만 외시경이 비어 있다. 안에서 밖을 보는 게 아니라, 밖에서 안을 보라는 듯이.',soft:'복도의 모든 문 외시경 너머에서 누가 나를 보고 있다. 문 하나만 외시경이 비어 있다.',
   o:[{l:'빈 외시경을 들여다본다',s:'sen',dc:12,ok:['안은 내 방과 똑같다. 누군가 내 침대에 앉아 내 일기를 소리 없이 읽고 있다. 책상 위에 설계도 조각이 펼쳐져 있었다. 위치를 외워 두었다.',{clue:1,mind:-6}],no:['외시경 너머에 눈이 바로 붙어 있었다. 눈꺼풀이 없는 눈. 나와 눈이 마주친 채로, 그 눈이 천천히 웃었다.',{mind:-12,fx:'delirium'}]},
     {l:'외시경을 손바닥으로 가리며 지나간다',r:['손바닥으로 하나씩 가리며 지나갔다. 다 지나고 보니 손바닥에 속눈썹이 한 올씩 붙어 있었다.',{mind:-4}]}]},
  {id:'iron',n:'다림질하는 집',t:'열린 문 안에서 누가 다림질을 하고 있다. 다리미 아래에 있는 건 옷이 아니라 엎드린 사람의 등이다. 김이 오른다. 엎드린 사람은 소리 내지 않는다. 다림질하는 사람이 고개도 들지 않고 말한다. 「주름이 안 펴져서요.」',soft:'열린 문 안에서 누가 다림질을 하고 있다. 김이 오른다. 고개도 들지 않고 말한다. 「주름이 안 펴져서요.」',
   o:[{l:'「제가 잡아 드릴까요」',s:'talk',dc:11,ok:['다림질하던 손이 멈췄다. 「친절하시네.」 앞치마 주머니에서 꼬깃한 지폐를 꺼내 주었다. 엎드린 사람의 등은 이제 반듯했다.',{money:35,mind:-6}],no:['다리미가 내 손등에 올라왔다. 「여기도 주름이 졌네.」 살 타는 냄새가 났다.',{hp:-14,mind:-6}]},
     {l:'조용히 문을 닫는다',r:['문을 닫는데 엎드린 사람이 처음으로 고개를 들었다. 나와 같은 얼굴이었다. 아니, 같은 얼굴이 되어 가는 중이었다.',{mind:-5}]}]}],
 /* 2 중층 · 설계도대로 지은 복도 */
 [{id:'ruler',n:'줄자를 든 사람',t:'복도에서 누가 줄자로 사람들 키를 재고 있다. 줄 선 사람들은 모두 고개를 숙였다. 재고 나면 중얼거린다. 「설계도엔 이 키가 아니야.」 그리고 맞게 잘라 준다. 줄 맨 끝에 내 자리가 있다.',soft:'복도에서 누가 줄자로 사람들 키를 재고 있다. 재고 나면 중얼거린다. 「설계도엔 이 키가 아니야.」 줄 맨 끝에 내 자리가 있다.',

     {l:'줄에서 빠져 달아난다',s:'agi',dc:11,ok:['뒤에서 줄자 감기는 소리가 따라왔지만 계단까지 먼저 닿았다.',{mind:-4}],no:['줄자 끝 쇠붙이가 발목을 낚아챘다. 겨우 풀고 도망쳤지만, 발소리가 하나 더 따라왔다.',{hp:-10,mind:-6,fx:'followed'}]}]},
  {id:'door99',n:'아흔아홉 번째 문',t:'복도 양쪽에 문이 늘어서 있다. 세어 보니 아흔아홉 개. 모두 닫혀 있다. 그중 하나가 숨을 쉰다. 문이 부풀었다 꺼질 때마다 틈새로 따뜻한 바람이 나온다.',soft:'복도 양쪽에 문이 아흔아홉 개 늘어서 있다. 그중 하나가 숨을 쉬듯 부풀었다 꺼진다.',
   o:[{l:'숨 쉬는 문을 연다',s:'sen',dc:12,ok:['안쪽 벽에 연필로 메모가 빼곡하다. 설계자의 글씨다. 「아흔아홉은 모자라다. 한 칸이 더 필요하다.」 메모 한 장을 뜯어 왔다.',{clue:1,mind:-6}],no:['문 안쪽 벽이 폐처럼 오그라들며 나를 빨아들였다. 문지방을 붙잡고 겨우 버텼다. 들이쉬는 숨에 내 이름 한 글자가 같이 빨려 들어갔다.',{hp:-12,mind:-8,corr:1}]},
     {l:'문을 다시 세어 본다',r:['다시 셌다. 백 개. 한 번 더 셌다. 백한 개. 세는 동안 내 이름이 기억나지 않았다.',{mind:-6,blur:1}]}]},
  {id:'chalk',n:'바닥의 설계도',t:'복도 바닥에 분필로 설계도가 그려져 있다. 내가 사는 방 자리에 X 표시가 있고, 그 안에 사람 윤곽이 누워 있다. 윤곽은 내 키에 꼭 맞다.',soft:'복도 바닥에 분필로 설계도가 그려져 있다. 내가 사는 방 자리에 X 표시가 있고, 사람 윤곽이 그려져 있다.',
   o:[{l:'발로 문질러 지운다',s:'str',dc:10,ok:['X가 지워지자 어딘가에서 망치 소리가 멈췄다. 지운 자리 밑에 설계도 조각이 깔려 있었다.',{clue:1,mind:-5}],no:['분필 가루가 손바닥에 묻었다. 털어도 지워지지 않는다. 대신 손금이 지워지고 있다.',{mind:-10,blur:1}]},

  {id:'tailor',n:'수선집',t:'「치수 좀 재 갈게.」 수선집 주인이 바늘로 내 그림자 가장자리를 바닥에 꿰매고 있다. 한 땀 한 땀. 발이 바닥에서 떨어지지 않는다.',soft:'수선집 주인이 바늘로 내 그림자 가장자리를 바닥에 꿰매고 있다. 발이 바닥에서 떨어지지 않는다.',

  {id:'noodle5',n:'4번 테이블뿐인 국숫집',t:'테이블이 하나뿐인 국숫집이다. 테이블 번호는 4번. 국수가 이미 나와 있다. 고명이 손톱이다. 주인이 젓가락을 내 쪽으로 밀어 준다. 「식기 전에.」',soft:'테이블이 하나뿐인 국숫집이다. 테이블 번호는 4번. 국수가 이미 나와 있다. 「식기 전에.」',

 /* 4 지하 · 물 없는 수로 */
 [{id:'paperboat',n:'종이배',t:'마른 수로 바닥에 물이 조금 고여 흐른다. 종이배 수백 척이 떠내려간다. 배마다 이름이 적혀 있다. 그중 하나가 내 이름이다.',soft:'마른 수로에 종이배 수백 척이 떠내려간다. 배마다 이름이 적혀 있다. 그중 하나가 내 이름이다.',

  {id:'lullaby',n:'수로 끝의 자장가',t:'수로 끝에서 콧노래가 들린다. 어릴 때 듣던 자장가다. 그 노래를 불러 주던 사람은 이제 없다.',soft:'수로 끝에서 콧노래가 들린다. 어릴 때 듣던 자장가다.',
   o:[{l:'노래를 따라간다',s:'sen',dc:13,ok:['노래를 부르던 건 물에 반쯤 잠긴 낡은 라디오였다. 라디오 위에 거꾸로 가는 시계가 놓여 있었다. 노래는 시계를 집어 들자 멈췄다.',{item:'rclock',mind:-10}],no:['따라가다 보니 노래가 앞에서 들리지 않았다. 내 목에서 나오고 있었다. 멈추려 해도 입이 다물어지지 않았다.',{mind:-12,fx:'delirium'}]},

function bondInviteGroups(avail,pid){const categories=[['지금 필요한 돌봄',['mend']],['일상 · 쉬기',['cig','noodle','tea2','roof','mahjong2']],['다정하게',['umb','radio','stairs','coat','mirror']],['깊은 이야기',['secret','letter','sleep']],['짓궂게 · 위험하게',['dare']],['악연 전용',['enemy_punch','enemy_trip','enemy_collar']]];
 const known=new Set(categories.flatMap(x=>x[1]));const rest=avail.filter(v=>!known.has(v.id));if(rest.length)categories.push(['다른 장면',rest.map(v=>v.id)]);
 return h('div',{class:'stack',style:'gap:12px'},categories.map(([label,ids])=>{const vs=avail.filter(v=>ids.includes(v.id));if(!vs.length)return null;
 const buttons=h('div',{class:'wrap',style:'gap:6px'},vs.map(v=>h('button',{class:'sm',style:v.id==='mend'?'border-color:var(--bad);color:var(--bad)':'',onclick:()=>bondInvite(pid,v)},v.label)));
 if(label==='짓궂게 · 위험하게'||label==='악연 전용')return h('details',null,h('summary',{style:'cursor:pointer;color:var(--bad)'},`${label} · ${vs.length}개`),buttons);
 return h('div',{class:'stack',style:'gap:6px'},h('span',{class:'dim',style:'font-size:12.5px'},label),buttons)}))}

{const tk12=tick;tick=function(){const r=tk12.apply(this,arguments);try{const m=G.me;if(m){if(m.rank==='hong')tc(m).wasHong=1;if(m.rank==='white')tc(m).wasWhite=1}}catch(e){}return r}}

/* 6. 가게 단골: 손님은 몇 번 샀는지 세고, 주인은 단골 이름을 본다 */
if(typeof shopPay==='function'){const sp11=shopPay;shopPay=async function(pid,price,data){const c=tc(G.me);c.shopN=c.shopN||{};const n=(c.shopN[pid]||0)+1;const ok=await sp11.call(this,pid,price,Object.assign({},data,{nth:n}));if(ok){c.shopN[pid]=n;if(n===5)setTimeout(()=>toast(`「${shopName(SAMPLES[pid])}」 단골이 되었어요.`),600)}return ok}}
if(typeof bondProcess==='function'){const bp11=bondProcess;bondProcess=function(){try{const m=G.me;if(m&&m.shop){const ap=bApplied();for(const x of BONDS){if(ap[x.id]||x.kind!=='gift'||x.to_char!==m.id||x.status!=='open'||!(x.data&&x.data.shop))continue;
  m.shop.cust=m.shop.cust||{};const nm=bName(x.from_char);m.shop.cust[nm]=Math.max(m.shop.cust[nm]||0,+x.data.nth||((m.shop.cust[nm]||0)+1));const keys=Object.keys(m.shop.cust);if(keys.length>40){keys.sort((a,b)=>m.shop.cust[a]-m.shop.cust[b]).slice(0,keys.length-40).forEach(k=>delete m.shop.cust[k])}}}}catch(e){}return bp11.apply(this,arguments)}}
const shopRegs=p=>Object.entries((p.shop&&p.shop.cust)||{}).filter(([,n])=>n>=5).sort((a,b)=>b[1]-a[1]).map(([k])=>k);
if(typeof shopManage==='function'){const sm11=shopManage;shopManage=function(){const r=sm11.apply(this,arguments);try{const regs=shopRegs(G.me);const st=document.querySelector('#modalRoot .stack');if(st)st.insertBefore(h('p',{class:'mute',style:'margin:0;font-size:12.5px'},regs.length?`단골 · ${regs.slice(0,8).join(', ')}`:'아직 단골이 없어요. 다섯 번 사 간 손님이 단골이 돼요.'),st.children[2]||null)}catch(e){}return r}}
if(typeof shopVisit==='function'){const sv12=shopVisit;shopVisit=function(pid){const r=sv12.apply(this,arguments);try{const n=(tc(G.me).shopN||{})[pid]||0;const st=document.querySelector('#modalRoot .stack');const regs=shopRegs(SAMPLES[pid]);
  if(st)st.insertBefore(h('p',{class:'mute',style:'margin:0;font-size:12.5px'},`${n>=5?'단골 · ':''}여기서 ${n}번 샀다${regs.length?` · 이 가게 단골: ${regs.slice(0,5).join(', ')}`:''}`),st.children[2]||null)}catch(e){}return r}}

{const tk13=tick;tick=function(){const r=tk13.apply(this,arguments);try{const m=G.me;if(m&&m.pet&&m.pet.name&&m.cell&&chance(.02)){const dl=daily();if(!dl.petMeet){const ids=SAMPLE_IDS.filter(id=>{const p=SAMPLES[id];return p&&p.pet&&p.pet.name&&p.cell===m.cell&&online(p)});
  if(ids.length){dl.petMeet=1;const p=SAMPLES[pick(ids)];const line=pick(PET_MEET).replace(/\{a\}/g,`「${m.pet.name}」`).replace(/\{b\}/g,`${p.name}네 「${p.pet.name}」`);log(line,'rel');toast(line);save()}}}}catch(e){}return r}}

 'babycry.1.ok':'눌렀다. 따뜻했다. 무언가 마주 미는 느낌이 들다가 이윽고 조용해졌다. 손바닥에 벽지 무늬가 남았다.',

 'fireext.1.no':'들자마자 소화기가 바닥으로 쏟아졌다. 하얀 가루 사이로 작고 단단한 것들이 굴러 내 발치에서 멈췄다.',
 'butcher.0.no':'주인이 고개를 저었다. 칼끝이 내 팔뚝을 가볍게 짚고 지나갔다. 다치지는 않았는데, 그 자리가 한동안 차가웠다.',

 'boatman.0.no':'배가 기울었다. 바닥 쪽에서 아는 얼굴 하나가 나를 봤다. 누구인지 떠올리기 전에 사라졌다.',

 'n_dinner.0.no':'한 숟갈 떠먹었다. 무언가 딱딱한 것이 씹혔다. 뱉어 보니 작은 돌 같았다. 입안이 한참 얼얼했다.',
 'n_dinner.1.no':'의자를 밀어 넣는데 안 들어간다. 누가 앉아 있는 것처럼.',
 'n_corridor.0.no':'다리가 엉켜 넘어졌다. 어둠 속에서 누가 내 얼굴 앞에 잠시 머물다, 아니라는 듯 떠났다.',

/* 3. 실제로 열린 파티 탐사에 붙은 낡은 안내 문구 */
{const vn11=typeof viewNight==='function'?viewNight:null;if(vn11){viewNight=function(){const out=vn11.apply(this,arguments);try{for(const el of [].concat(out)){if(el&&el.querySelectorAll)el.querySelectorAll('p').forEach(p=>{if(p.textContent.includes('베타 2에서 열려요'))p.textContent='같은 칸에 지인이 있으면 「같이 둘러보기」로 함께 탐사할 수 있어요.'})}}catch(e){}return out}}}
/* ---------- 가게 계산대: 지인이 아니어도 살 수 있게 shop_sales 표를 쓴다 (21_shop.sql) ---------- */
if(typeof bondSend==='function'){const bs12=bondSend;bondSend=async function(pid,kind,data,status){if(!(kind==='gift'&&data&&data.shop))return bs12.apply(this,arguments);
  if(typeof sameOwner==='function'&&sameOwner(pid)){toast('내 다른 캐릭터의 가게에서는 살 수 없어요.');return null}
  const{data:row,error}=await sb.from('shop_sales').insert({buyer:G.me.id,seller:pid,data,status:'open'}).select().single();
  if(error){toast(/relation|does not exist|schema cache/i.test(error.message||'')?'가게 계산대가 아직 없어요. 운영자에게 21_shop.sql 실행을 부탁해 주세요.':'계산하지 못했어요. 잠시 뒤 다시 해 주세요.');return null}return row}}
/* 주인: 1분마다 계산대를 확인해서 손님이 낸 돈을 받는다. 'open'인 줄만 'done'으로 바꾸고, 바뀐 줄만 받는다 (기기 둘이어도 두 번 안 받음) */
let SHOP_POLL=0,SHOP_BUSY=false;
async function shopCollect(force){const m=G.me;if(!m||!m.shop||!m.shop.k||typeof sb==='undefined'||!sb||SHOP_BUSY)return;if(!force&&Date.now()-SHOP_POLL<60e3)return;SHOP_POLL=Date.now();SHOP_BUSY=true;
  try{const{data,error}=await sb.from('shop_sales').select('id,buyer,data').eq('seller',m.id).eq('status','open').limit(50);if(error||!data||!data.length)return;
    for(const x of data){const{data:up,error:e2}=await sb.from('shop_sales').update({status:'done'}).eq('id',x.id).eq('status','open').select('id');if(e2||!up||!up.length||G.me!==m)continue;
      const d=x.data||{},amt=Math.max(0,Math.floor(+d.money||0)),nm=bName(x.buyer);m.money+=amt;const dl=daily();dl.shopCust=(dl.shopCust||0)+1;if((dl.shopRep||0)<10){dl.shopRep=(dl.shopRep||0)+1;m.rep=(m.rep||0)+1}
      m.shop.cust=m.shop.cust||{};m.shop.cust[nm]=Math.max(m.shop.cust[nm]||0,+d.nth||((m.shop.cust[nm]||0)+1));
      if(d.buy==='item'&&m.shop.stock){const i=m.shop.stock.findIndex(s=>s.id===d.sid);if(i>=0)m.shop.stock.splice(i,1)}
      log(`${nm}이(가) 가게에서 ${d.note||'물건'}을(를) 샀다. $${amt}`,'life');toast(`가게 손님 ${nm} · $${amt}`)}
    save();try{render()}catch(e){}}catch(e){}finally{SHOP_BUSY=false}}
{const tk14=tick;tick=function(){const r=tk14.apply(this,arguments);try{shopCollect(false)}catch(e){}return r}}
if(typeof shopManage==='function'){const sm14=shopManage;shopManage=function(){shopCollect(true);return sm14.apply(this,arguments)}}
/* ---------- 시작 ---------- */
async function boot(){
  if(!sb){gate(h('div',{class:'card stack'},gateHead(),h('p',null,'Supabase 주소와 공개 키가 아직 들어 있지 않아요. 파일 맨 위의 SUPABASE_URL과 SUPABASE_KEY를 채워 주세요.')));return}
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==='PASSWORD_RECOVERY'){AUTH=session.user;showNewPassword();return}if(ev==='SIGNED_IN'&&session&&(!AUTH||AUTH.id!==session.user.id)){AUTH=session.user;afterLogin()}if(ev==='SIGNED_OUT'){AUTH=null}});
  const{data}=await sb.auth.getSession();if(data.session){AUTH=data.session.user;if(!location.hash.includes('type=recovery'))afterLogin()}else showAuth('login');
  subscribe();
  setInterval(()=>{$('clock').textContent=hm(T());if(G.me){const w=!!G.me.work;tick();if(w&&!G.me.work)save();renderLeft()}},1000);
  setInterval(()=>{if(G.me&&!document.hidden){loadOthers().then(()=>{renderPeople();if(tab==='people')renderView()});lastSaved='';dirty=true;flush()}},120000);
  setInterval(()=>{if(G.me){renderChat();document.body.classList.toggle('build',isBuild()&&!G.opts.soft)}},60000);
}
boot();
