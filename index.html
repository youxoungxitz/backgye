.tiles{height:8px;background:

  var(--tileA);opacity:.85}

function rentCheck(){const m=G.me,w=weekIdx(T());if(m.rentWeek==null){m.rentWeek=w;return}if(w<=m.rentWeek)return;

const STAT_MAX=100;
const statNeed=v=>6+Math.floor(v*0.6);

function gainStat(stat,n){const m=G.me;m.sxp=m.sxp||{};if(m.stats[stat]>=STAT_MAX)return null;m.sxp[stat]=(m.sxp[stat]||0)+n;let up=0;
  while(m.stats[stat]<STAT_MAX&&m.sxp[stat]>=statNeed(m.stats[stat])){m.sxp[stat]-=statNeed(m.stats[stat]);m.stats[stat]++;up++}
  if(up){const nm=STATS.find(x=>x[0]===stat)[1];log(`${nm}이(가) 올랐다. ${m.stats[stat]-up} → ${m.stats[stat]}`,'life');toast(`${nm} +${up} (${m.stats[stat]})`);return `${nm} +${up}`}return null}

  return{ok,txt:`${STATS.find(s=>s[0]===stat)[1]} ${sv} + 주사위 ${d}${pen?` ${pen}`:''} = ${tot} / 목표 ${D}${g?' · '+g:''}`}}
function give(rw){const m=G.me,out=[];if(!rw)return out;
  const add=(k,v,label,fmt)=>{if(!v)return;m[k]=(m[k]||0)+v;out.push(fmt?fmt(v):`${label} ${v>0?'+':''}${v}`)};
  if(rw.money){m.money=Math.max(0,m.money+rw.money);out.push(`$${rw.money>0?'+':''}${rw.money}`)}
  if(rw.hp){m.hp=Math.max(1,Math.min(100,m.hp+rw.hp));out.push(`체력 ${rw.hp>0?'+':''}${rw.hp}`)}
  if(rw.mind){let v=rw.mind;if(v<0&&(hasFx('cozy')||hasFx('clothes')))v=Math.round(v/2);m.mind=Math.max(0,Math.min(100,m.mind+v));out.push(`정신 ${v>0?'+':''}${v}`)}
  if(rw.en){m.en=Math.max(0,Math.min(EN_MAX,m.en+rw.en));out.push(`기력 ${rw.en>0?'+':''}${rw.en}`)}
  add('merit',rw.merit,'공적');add('credit',rw.credit,'신용');add('rep',rw.rep,'평판');
  if(rw.debt){m.debt=Math.max(0,m.debt+rw.debt);out.push(`빚 ${rw.debt>0?'+':''}$${rw.debt}`)}
  if(rw.clue){m.clues=(m.clues||0)+rw.clue;out.push('설계도 조각 +1')}
  if(rw.item){m.items[rw.item]=(m.items[rw.item]||0)+1;out.push(`밤물건 「${ITEMS[rw.item].n}」`)}
  if(rw.fx){addFx(rw.fx);out.push(FXDEF[rw.fx].n)}

  return out}

 '0-2':['기계가 멈춘 틈에 공장장이 어묵 꼬치 하나를 건넨다. 뜨겁다.','튀김 기름 냄새 속에 비릿한 냄새가 섞인다. 생선이 아닌 것 같다.','작업복 사물함 하나에 자물쇠가 세 개 채워져 있다.','증기 너머 작업대에 누군가 서 있다가, 증기가 걷히자 없다.','반죽 기계에서 뽑혀 나오는 어묵에 손가락 자국이 찍혀 있다. 아무도 만지지 않았다.'],
 '1-2':['철문 너머로 계산기 두드리는 소리. 빚 장부는 오늘도 두꺼워진다.','재봉 공장 아주머니들이 사무실 쪽을 보며 목소리를 낮춘다.','사무실 앞 의자에 객 하나가 무릎을 꿇고 앉아 있다. 아무도 일으켜 세우지 않는다.','금고 옆 액자 속 사진. 방주라고 했다. 얼굴 부분만 오려져 있다.','재봉틀 소리가 일제히 멈추더니, 한 대만 계속 돈다.'],
 '2-2':['줄에 걸린 수칙 문서 중 한 장에만 9번 수칙이 있다. 글씨가 번져 읽을 수 없다.','인쇄공이 활자 서랍을 뒤진다. 「사(死) 자가 또 없어졌네.」','잉크 냄새에 머리가 띵하다. 종이 더미 사이로 오래된 신문이 보인다.','인쇄기가 혼자 한 장을 찍어 낸다. 백지다. 아니, 아주 희미하게 계단 그림이 있다.','교정지를 넘기던 인쇄공이 웃는다. 「이번 판엔 수칙이 하나 늘었어. 누가 넣었는지는 몰라.」'],
 '3-2':['천을 들춰 보니 재봉틀 바늘에 실이 꿰어져 있다. 방금 누가 쓴 것처럼.','공방 달력이 9년 전 3월에서 멈춰 있다. 4일에만 동그라미.','기계 사이 바닥에 분필로 사람 윤곽이 그려져 있다. 크기가 아이만 하다.','멈춘 선풍기 날개가 천천히 돈다. 바람은 없다.','작업대 위에 반쯤 깎다 만 나무 계단 모형. 칸 수를 세다 그만두었다.'],
 '0-3':['정문 경비 노인이 신문을 접으며 고개를 젓는다. 「바깥은 오늘도 우리 얘기 안 해.」','바깥에서 들어온 택시 기사가 길을 잃었다며 두리번거린다. 정문은 바로 뒤에 있다.','공중전화 부스 유리에 립스틱으로 전화번호가 적혀 있다. 끝자리가 지워졌다.','정문 밖 레이란 거리의 소음이 한 걸음 안쪽에서는 거짓말처럼 작아진다.','외판원이 정문 앞에서 성채를 올려다보다 그냥 돌아간다.'],
 '1-3':['전당포 진열장에 결혼반지 열두 개가 나란히 놓여 있다. 이름이 새겨진 쪽이 다 안쪽을 향했다.','마작방 문이 열릴 때마다 담배 연기와 웃음소리가 쏟아진다.','붉은 등 하나가 꺼져 있다. 그 아래 서 있는 사람만 얼굴이 보이지 않는다.','국숫집 주인이 문 앞에 소금을 뿌린다. 「오늘은 손님이 많을 거라서.」','점쟁이 노파가 좌판을 편다. 손님 손금을 보다가 「여기 계단이 하나 많네」 한다.'],
 '2-3':['전파상 진열대의 라디오들이 일제히 같은 채널에 맞춰져 있다.','삼경 의원 앞 의자에 붕대 감은 사람들이 줄지어 앉아 있다. 다들 손을 다쳤다.','벽에 「수칙을 지키면 삽니다」 표어가 덧칠돼 있다. 덧칠 아래 글씨가 다르다.','전파상 주인이 수리하던 삐삐를 흔든다. 「이거 주인이 누군지 아나? 계속 울려.」','의원 창문에 「발치 안 함」 종이가 붙어 있다. 누가 물어봤나 보다.'],
 '3-3':['꺼진 간판들 사이로 「한빛치과」 간판만 먼지가 덜 앉았다.','빈 가게 셔터마다 분필로 X 표시. 하나만 O다.','골목 끝 자판기가 혼자 불을 켠다. 버튼 하나만 「품절」이 아니다.','누가 빈 가게 앞에 화분을 내놓았다. 물을 준 지 얼마 안 됐다.','셔터 아래 틈으로 형광등 불빛이 새어 나온다. 그 가게는 9년째 비어 있다.'],
 '0-4':['물살이 바깥으로 나간다. 나뭇잎 하나가 거꾸로 흘러 들어온다.','배수로 벽에 아이 키 높이로 눈금이 그어져 있다. 해마다 조금씩 높아진다.','쥐 한 마리가 내 발을 지나치더니 멈춰서 돌아본다.','물에 떠내려온 신발 한 짝. 끈이 단단히 묶여 있다.','배수로 철창 너머로 바깥 바다가 조금 보인다. 파도가 성채 쪽으로만 친다.'],
 '1-4':['도박장 문지기가 손바닥을 내민다. 「입장료는 이름이야.」 농담인지 모르겠다.','판돈 대신 열쇠 꾸러미가 테이블에 오른다.','지하 벽이 축축하다. 귀를 대면 물 흐르는 소리 위로 마작 패 소리.','진 사람이 테이블에 이마를 박고 운다. 아무도 쳐다보지 않는다.','구석 테이블은 늘 비어 있다. 의자 넷, 패 넷. 아무도 앉지 않는데 패가 바뀌어 있다.'],
 '2-4':['우물가에 물동이가 줄지어 있다. 하나만 뒤집혀 있다.','삼경 대원이 우물 뚜껑에 새 수칙을 붙이고 간다. 「끓여 마실 것」','두레박 줄에 머리카락 한 올이 감겨 있다. 아주 길다.','우물 벽 이끼 사이에 동전이 박혀 있다. 소원을 빈 사람이 많았나 보다.','우물 안에서 올라오는 공기가 따뜻하다. 지하인데.'],
 '3-4':['돌을 던졌다. 파문이 한참 뒤에야 온다. 반대쪽에서부터.','수면에 형광등이 비친다. 천장에는 형광등이 없다.','가장자리에 젖은 발자국. 물에서 나온 방향이다.','물 위에 종이학이 떠 있다. 날개에 4동 어느 집 주소가 적혀 있다.','저장조 벽에 「수위 4」라고 페인트로 적혀 있다. 물은 그 선에 딱 맞춰 고여 있다.'],

function freshLine(pool){const m=G.me;m.recent=m.recent||[];const opts=pool.filter(x=>!m.recent.includes(x));const ln=pick(opts.length?opts:pool);m.recent.push(ln);if(m.recent.length>40)m.recent.shift();return ln}
function ambientText(k,t){const parts=[];if(chance(.45))parts.push(freshLine(OPENERS[tod()]||OPENERS['한밤']));else if(chance(.35))parts.push(freshLine(WX_OPEN[weather()[0]]||WX_OPEN['흐림']));

   {l:'모른 척 지나간다',r:{t:'등 뒤에서 셈이 다시 시작된다. 「…하나, 둘, 셋.」\n이번엔 내 발소리에 맞춰 센다.',rw:{mind:-3}}}]},
  hide:{t:'빈 집 장롱에 숨었다. 좀약 냄새. 술래 발소리가 다가온다.\n어둠 속에서 누가 먼저 와 있다. 작은 손이 내 손을 잡는다. 차갑다.',o:[
   {l:'손을 꼭 잡아 준다',s:'nerve',dc:12,ok:{t:'「찾았다!」 장롱 문이 벌컥 열린다. 밖엔 아무도 없다.\n손바닥에 박하사탕 하나가 쥐여 있다. 입에 넣으니 머리가 맑아진다.',rw:{mind:-2,en:1}},no:{t:'손이 점점 차가워진다. 손가락이 하나, 둘 늘어난다.\n정신을 차리니 장롱 밖이다. 손목에 작은 손자국이 남아 있다.',rw:{mind:-12,fx:'followed'},bad:1,fear:1}},
   {l:'장롱 밖으로 뛰쳐나간다',r:{t:'술래가 바로 앞에 서 있었다. 「찾았다.」\n그 아이의 얼굴이 기억나지 않는다. 눈코입이 있었는지도.',rw:{mind:-10,fx:'delirium'},bad:1}}]}}},
 umbrella:{n:'빨간 우산',w:(d,t)=>t===3&&weather()[0]==='비',s:{
  start:{t:'골목 한가운데 빨간 우산 하나가 펼쳐진 채 서 있다. 아무도 들고 있지 않다.\n우산 아래만 비가 오지 않는다.',o:[
   {l:'우산 아래로 들어간다',r:{go:'under',t:'우산 아래로 들어서자 빗소리가 멀어진다. 귀가 먹먹하다.'}},
   {l:'우산을 접는다',s:'str',dc:10,ok:{t:'우산을 접자 안에서 물이 한 바가지 쏟아진다. 짜다. 바닷물이다.\n바닥에 조개껍데기와 동전 몇 개가 흩어졌다.',rw:{money:12,mind:-3}},no:{t:'우산이 접히지 않는다. 손잡이가 따뜻하다. 누가 방금까지 쥐고 있던 것처럼.',rw:{mind:-6},bad:1}},
   {l:'지나친다',r:{t:'지나쳐 걸었다. 다음 골목 모퉁이에도 빨간 우산이 서 있었다. 그다음 모퉁이에도.',rw:{mind:-4}}}]},
  under:{t:'우산 아래는 조용하다. 그리고 옆에 누가 서 있다는 걸 안다. 젖은 옷 냄새.\n「같이 가요.」',o:[
   {l:'「어디로요?」 하고 묻는다',r:{t:'대답이 없다. 우산이 기울어지며 내 어깨를 덮는다.\n다음 골목에서 우산은 사라졌다. 비에 흠뻑 젖었는데, 왼쪽 어깨만 말라 있었다.',rw:{mind:-2,fx:'cozy'}}},
   {l:'옆을 돌아본다',s:'nerve',dc:13,ok:{t:'옆에 선 건 흠뻑 젖은 노인이었다. 「고마워요. 정문까지만.」\n정문 앞에서 노인은 없다. 우산 손잡이에 오래된 주소 하나가 새겨져 있다. 4동이다.',rw:{clue:1,mind:-4}},no:{t:'얼굴이 없다. 젖은 머리카락만 있다. 머리카락 사이로 물이 끝없이 흘러내린다.',rw:{mind:-14,fx:'delirium'},bad:1,fear:1}}]}}},
 myvoice:{n:'라디오 속 목소리',w:(d,t)=>t===3||t===2,s:{
  start:{t:'전파상 앞을 지나는데 라디오에서 내 목소리가 나온다.\n「…그래서 4동에 갔는데,」\n나는 그런 말을 한 적이 없다.',o:[
   {l:'끝까지 듣는다',r:{go:'listen',t:'라디오 앞에 쪼그려 앉았다. 지지직거리는 소리 사이로 내 숨소리까지 들린다.'}},
   {l:'라디오를 끈다',r:{t:'스위치를 내렸다. 꺼진 라디오에서 목소리가 계속된다.\n전파상 주인이 플러그를 뽑아 들어 보인다. 그래도 계속된다.',rw:{mind:-8},bad:1}},
   {l:'전파상 주인에게 묻는다',s:'talk',dc:10,ok:{t:'「요즘 그런 사람 많아. 아직 안 한 말이 먼저 나오는 거야.」 주인이 드라이버를 내려놓는다. 「내일쯤 그 말 하게 될걸. 하지 마.」',rw:{mind:-3,rep:2}},no:{t:'주인이 고개를 갸웃한다. 「무슨 소리? 아무 소리도 안 나는데.」',rw:{mind:-8},bad:1}}]},
  listen:{t:'「…4동에 갔는데, 거기 계단이 하나 더 있었어. 그래서 올라갔지. 그리고—」\n지지직.\n「—그러니까 너는 가지 마.」',o:[
   {l:'들은 걸 수첩에 받아 적는다',r:{t:'받아 적었다. 다시 읽어 보니 마지막 줄이 내 글씨가 아니다. 「계단 끝에서 기다릴게.」',rw:{clue:1,mind:-6}}},
   {l:'다른 채널로 돌린다',r:{t:'옛날 노래가 나온다. 어릴 때 누가 불러 주던 노래다. 가사가 조금 다르다. 계단이 나온다.',rw:{mind:-4}}}]}}},
 garlic:{n:'복도 끝 할머니',w:(d,t)=>t===1,s:{
  start:{t:'복도 끝에 할머니가 등을 돌리고 앉아 마늘을 깐다. 마늘 냄새가 매캐하다.\n가까이 갈수록 복도가 조금씩 길어진다.',o:[
   {l:'말을 건다',r:{go:'talk',t:'「할머니, 여기서 뭐 하세요?」 마늘 까는 손이 멈춘다.'}},
   {l:'옆에 앉아 마늘 까는 걸 돕는다',r:{t:'할머니 옆에 쪼그려 앉아 마늘을 깠다. 손끝이 아리다. 다 까고 나니 할머니가 마늘 한 줌을 쥐여 준다.\n「오늘 밤 문간에 둬. 그럼 아무도 안 들어와.」',rw:{mind:4,fx:'guarded'}}},
   {l:'돌아선다',r:{t:'돌아서자마자 바로 등 뒤에서 마늘 까는 소리가 들린다. 아까보다 가깝다.',rw:{mind:-5}}}]},
  talk:{t:'할머니가 등을 돌린 채 묻는다.\n「너, 몇 층 사니?」',o:[
   {l:'한 층 낮춰 말한다',r:{t:'「그래, 착하다.」 할머니가 다시 마늘을 깐다. 복도가 원래 길이로 줄어든다.\n지나치며 보니 할머니 앞 바구니에 마늘이 아니라 이빨이 담겨 있다.',rw:{mind:-4}}},
   {l:'사실대로 말한다',r:{t:'「거기, 내 집인데.」\n할머니가 천천히 고개를 돌린다. 얼굴이 내 얼굴이다. 아주 늙은.',rw:{mind:-14},bad:1,fear:1,hidden:'floorask'}}]}}},
 fish:{n:'수로의 물고기',w:(d,t)=>t===4,s:{
  start:{t:'수로 물속으로 물고기 떼가 지나간다. 한 마리가 수면 위로 고개를 내민다.\n사람처럼 눈꺼풀이 있다. 천천히 깜빡인다.',o:[
   {l:'주머니의 빵 조각을 던져 준다',r:{t:'물고기가 빵을 받아먹고 고개를 숙인다. 인사처럼.\n돌아서는데 물속에서 작게 「고마워」 하는 거품 소리.',rw:{mind:2}}},
   {l:'손으로 잡는다',s:'agi',dc:12,ok:{t:'손에 잡힌 물고기가 내 이름을 뻐끔거린다. 놓아주자 수로 안쪽으로 사라졌다.\n손바닥에 비늘 대신 셔츠 단추 하나가 남았다.',rw:{clue:1,mind:-6}},no:{t:'물에 빠질 뻔했다. 물속에서 수십 개의 눈꺼풀이 동시에 깜빡였다.',rw:{hp:-8,mind:-10},bad:1,fear:1}},
   {l:'못 본 척한다',r:{t:'못 본 척 지나쳤다. 물살이 한동안 내 걸음을 따라왔다.',rw:{mind:-2}}}]}}},
 knock:{n:'노크',w:(d,t)=>t===1&&(hour()>=21||hour()<6),s:{
  start:{t:'방문에 노크 소리. 똑, 똑, 똑.\n그리고 낯익은 목소리.\n「나야, {friend}. 문 좀 열어 줘.」',o:[
   {l:'문을 연다',r:{go:'open',t:'문고리를 돌렸다. 복도 형광등이 지직거린다.'}},
   {l:'처음 만난 곳이 어디냐고 묻는다',s:'talk',dc:11,ok:{t:'문 너머가 한참 조용하다.\n「…나라니까.」 목소리가 조금 낮아진다. 발소리가 멀어진다. 아래가 아니라 위층으로.',rw:{mind:-6}},no:{t:'「나야. 나라고. 나야. 나야. 나야.」\n같은 말이 문 바로 앞에서 밤새 반복됐다.',rw:{mind:-14,fx:'delirium'},bad:1,fear:1}},
   {l:'숨죽이고 무시한다',s:'nerve',dc:10,ok:{t:'노크가 멎었다. 아침에 문 앞에 진흙 묻은 발자국이 있었다. 맨발이다. 발가락이 여섯 개.',rw:{mind:-5}},no:{t:'노크가 계속된다. 점점 아래쪽에서. 바닥 가까이에서. 문틈 바로 앞에서.',rw:{mind:-10},bad:1,fear:1}}]},
  open:{t:'복도엔 아무도 없다. 형광등 하나가 흔들린다.\n문을 닫고 돌아서니, 방 안 의자 방석이 움푹 꺼져 있다. 만져 보니 따뜻하다.',o:[
   {l:'방을 샅샅이 살핀다',s:'sen',dc:12,ok:{t:'침대 밑에서 낯선 손거울을 찾았다. 거울 속 내 방에는 사람이 한 명 더 앉아 있다.',rw:{item:'mirror',mind:-10},bad:1},no:{t:'아무것도 없다. 그런데 칫솔이 두 개가 됐다.',rw:{mind:-8},bad:1}},
   {l:'그냥 불을 끄고 잔다',r:{t:'잤다. 꿈에서 누가 내 이불을 목까지 덮어 주었다. 아침에 이불은 정말 목까지 덮여 있었다.',rw:{mind:-4,en:1}}}]}}},
 stairs:{n:'계단 세기',w:(d,t)=>t===1||t===2,s:{
  start:{t:'계단을 세며 내려간다. 스물넷, 스물다섯….\n아래층 계단참이 보이지 않는다. 형광등 간격이 점점 넓어진다.',o:[
   {l:'계속 센다',s:'nerve',dc:12,ok:{t:'마흔넷에서 계단참이 나왔다. 올라올 땐 스물넷이었다.\n벽에 누가 못으로 「44」라고 긁어 놓았다. 그 밑에 더 작게 「너도?」',rw:{clue:1,mind:-6}},no:{go:'endless',t:'숫자가 쉰을 넘었다. 아래에서 누가 같이 세는 소리가 들린다. 한 박자 늦게.'}},
   {l:'되돌아 올라간다',r:{t:'세 계단 만에 원래 층이다. 숨이 찬다. 다리가 후들거린다. 한참 내려갔다 올라온 것처럼.',rw:{en:-1}}},
   {l:'눈을 감고 내려간다',s:'sen',dc:11,ok:{t:'발끝으로 더듬어 내려왔다. 눈을 뜨니 원래 가려던 층이다.',rw:{}},no:{go:'endless',t:'눈을 떴는데도 어둡다. 계단은 계속된다.'}}]},
  endless:{t:'숫자가 백을 넘었다. 계단은 끝나지 않고, 벽의 층 표시가 점점 낡아 간다.\n마지막 표시는 손으로 쓴 「0」.',o:[
   {l:'난간을 넘어 뛰어내린다',s:'agi',dc:13,ok:{t:'아래층 바닥에 굴렀다. 무릎이 까졌다. 올려다보니 계단은 고작 세 칸이다.',rw:{hp:-8,mind:-6}},no:{t:'난간 너머도 계단이다. 계단이 계단을 감싸고 있다.',rw:{hp:-12,mind:-14,fx:'delirium'},bad:1,fear:1}},
   {l:'소리 내어 내 이름을 부른다',r:{t:'내 이름을 크게 불렀다. 위에서 누가 대답한다. 그 목소리를 따라 올라오니 원래 층이다.\n대답한 목소리가 누구였는지는 생각하지 않기로 했다.',rw:{mind:-8}}}]}}},
 photo:{n:'단체 사진',w:(d,t)=>t===2,s:{
  start:{t:'공방 바닥에 사진 한 장. 성채 옥상에서 찍은 단체 사진이다.\n맨 뒷줄 가운데, 내가 서 있다.',o:[
   {l:'사진을 뒤집어 본다',r:{t:'뒷면에 날짜. 내가 성채에 오기 4년 전이다.\n그 아래 볼펜으로 「돌아왔구나」.',rw:{clue:1,mind:-8},bad:1}},
   {l:'주머니에 넣는다',r:{t:'사진을 주머니에 넣었다. 걸을 때마다 주머니 속에서 누가 소곤거린다. 무리 지어.',rw:{item:'film',mind:-5}}},
   {l:'찢는다',s:'str',dc:8,ok:{t:'사진이 찢어지지 않는다. 종이가 아니라 얇은 피부 같다. 바닥에 내려놓고 뒤도 안 보고 나왔다.',rw:{mind:-12},bad:1},no:{t:'사진 모서리에 손가락을 베였다. 피가 사진 속 내 얼굴에 떨어졌다.',rw:{hp:-5,mind:-6},bad:1}}]}}},
 cat:{n:'검은 고양이',w:()=>true,s:{
  start:{t:'검은 고양이가 앞서 걷다 멈춰 돌아본다. 노란 눈. 꼬리를 한 번 흔든다.\n따라오라는 것 같다.',o:[
   {l:'따라간다',r:{go:'follow',t:'고양이는 공방 뒤 좁은 틈으로 몸을 밀어 넣는다. 어깨가 겨우 들어간다.'}},
   {l:'쪼그려 앉아 쓰다듬는다',r:{t:'고양이가 손에 머리를 비빈다. 따뜻하다. 골골거리는 소리. 오랜만에 숨이 편해진다.',rw:{mind:6}}},
   {l:'발을 굴러 쫓아낸다',r:{t:'고양이가 하악질을 하더니 벽으로 걸어 들어간다. 벽 속으로.',rw:{mind:-6},bad:1}}]},
  follow:{t:'틈 너머에 작은 방이 있다. 누가 고양이 밥그릇과 촛불을 놓아두었다. 촛농이 아직 말랑하다.\n벽에 실종자 사진이 빼곡하다.',o:[
   {l:'사진을 하나하나 살핀다',s:'sen',dc:11,ok:{t:'사진 중 하나에 낯익은 얼굴. 국숫집 주인이다. 사진 아래 날짜는 30년 전.\n그런데 그때도 지금과 똑같은 얼굴이다.',rw:{clue:1,mind:-6}},no:{t:'살필수록 사진 속 얼굴들이 전부 이쪽을 향해 있다는 걸 알게 된다. 처음엔 옆을 보고 있었는데.',rw:{mind:-10},bad:1,fear:1}},
   {l:'촛불을 끄고 나온다',r:{t:'촛불을 끄자 고양이가 길게 운다. 나오는 길에 발소리가 하나 늘었다.',rw:{mind:-6,fx:'followed'},bad:1}},
   {l:'밥그릇에 먹을 걸 놓아 둔다',r:{t:'주머니 속 비스킷을 부숴 놓았다. 나올 때 고양이가 따라 나와 발치에 동전 하나를 떨어뜨렸다. 젖은 동전.',rw:{money:10,mind:3}}}]}}},
 errand:{n:'이웃의 부탁',w:(d,t)=>t===1&&d!==3,s:{
  start:{t:'옆집 사람이 문을 반쯤 열고 봉투를 내민다.\n「4동 1204호에 이것 좀 전해 줄래요? 내가 가면 안 돼서.」',o:[
   {l:'받아서 전해 준다',r:{go:'deliver',t:'봉투가 생각보다 무겁다. 안에서 무언가 굴러다닌다.'}},
   {l:'거절한다',r:{t:'「그래요.」 이웃이 문을 닫는다.\n문 너머에서 「다른 사람 찾아야겠네」 하는 목소리. 둘이다. 그 집은 혼자 산다.',rw:{mind:-3}}},
   {l:'몰래 봉투를 열어 본다',s:'sen',dc:10,ok:{t:'봉투 안엔 녹슨 열쇠 하나와 쪽지. 「돌려줄게. 이제 네 차례야.」',rw:{clue:1,mind:-4}},no:{t:'봉투가 찢어지며 흙이 쏟아진다. 젖은 흙. 지렁이 한 마리가 꿈틀거린다.',rw:{mind:-8},bad:1}}]},
  deliver:{t:'4동 1204호. 문패가 없다.\n문 아래 틈으로 봉투를 밀어 넣자 안에서 받아 가는 손. 하얗고 길다.\n「고마워요. 이건 수고비.」 문틈으로 지폐가 밀려 나온다. 젖어 있다.',o:[
   {l:'받는다',r:{t:'지폐를 받았다. 마르고 나니 지폐 속 인물 얼굴이 조금 웃고 있다.',rw:{money:30,mind:-5}}},

const WORLD_CH=[
['들어가며',['레이란에는 오늘도 비가 내린다. 항구 쪽 크레인 불빛이 빗물에 번져 뿌옇게 보이고, 착륙하려는 여객기가 지붕에 닿을 것처럼 낮게 머리 위를 지나간다. 비행기 소리가 멀어지고 나면 빗소리만 남는다.',
 '항구와 시가지 사이에 지도에는 나오지 않는 덩어리가 하나 있다. 처음 보는 사람은 그게 건물이라는 걸 바로 알아채지 못한다. 창문 옆에 또 창문이 붙어 있고, 베란다 위에는 누가 방을 하나 더 얹어 놓았고, 그 위로는 빨랫줄과 안테나가 빽빽하게 뻗어 있다. 아파트 여러 채가 서로 기대어 자라다가 한 덩어리로 굳어 버린 것처럼 보인다. 사람들은 그곳을 백계성(百階城)이라고 부른다. 계단이 백 개라서 붙은 이름이라는데, 끝까지 세어 본 사람은 없다.',
 '정문 골목으로 들어서면 빗소리가 한 겹 멀어진다. 대신 물 떨어지는 소리가 사방에서 들린다. 처마 끝에서, 녹슨 배관에서, 누가 걷지 않은 빨래에서. 어묵 튀기는 기름 냄새와 젖은 타일 냄새, 어디선가 피우는 향 냄새가 한데 섞여 코끝에 끈적하게 달라붙는다. 머리 위 형광등은 지지직 소리를 내며 깜빡이고, 벽에는 누렇게 바랜 종이 한 장이 붙어 있다.',
 '「백계성 주민 수칙. 새벽 3시에서 4시 사이 망치 소리가 들리면 방에 머물 것.」',
 '골목 안쪽으로 붉은 등이 줄지어 매달려 있다. 등 아래 서 있던 사내들이 새로 들어온 사람의 얼굴을 한 번씩 훑어본다. 빚을 질 사람인지, 돈을 낼 손님인지 가늠하는 눈이다. 반대편 종루 쪽 계단에서는 완장을 찬 사람들이 손전등을 들고 오르내린다. 밤이 깊어지면 성채에서 밖을 돌아다니는 사람은 그들뿐이다.',
 '누군가 지나가면서 낮게 말한다.',
 '「여기 처음이지? 빚은 적등방이 받으러 오고, 밤에는 삼경이 돌아. 그것만 알아 두면 돼. 아, 그리고 새벽 세 시엔 절대 밖에 나오지 마.」']],
['백계성과 레이란',['레이란은 바다를 끼고 있는 항구도시다. 배가 들어오면 물건이 들어오고, 사람도 같이 들어온다. 그렇게 들어온 사람 중 몇은 다시 나가지 못하고 성채로 흘러든다.',
 '백계성이 서 있는 땅은 오래전에 맺은 조약이 꼬이는 바람에 어느 나라 땅도 아니게 되었다. 그래서 레이란 경찰은 정문 앞까지만 오고 그 안으로는 들어오지 않는다. 세금을 걷으러 오는 사람도, 건축 허가를 내주는 사람도, 죽은 사람을 서류에 올리는 사람도 없다. 성채 안의 규칙은 성채 사람들이 알아서 만들어 왔다.',
 '그러다 보니 갈 곳 없는 사람들이 하나둘 모여들었다. 난민과 밀항자, 빚에 쫓기는 사람, 죄를 짓고 도망친 사람, 누군가를 찾으러 들어온 사람, 그리고 원래부터 여기서 나고 자란 사람들. 한 복도에서 여러 나라 말이 오가지만, 누구도 상대의 진짜 이름을 묻지 않는다. 여기서는 그게 예의다.',
 '성채는 크게 네 동으로 나뉜다.',
 '1동 정문동(正門樓)은 바깥과 맞닿은 동이다. 녹색 공중전화와 차찬텡, 철창 하숙이 있어서 성채에 처음 들어온 사람은 대개 이 동에서 첫날 밤을 보낸다.',
 '2동 홍등동(紅燈樓)은 적등방의 동이다. 국숫집과 전당포, 마작방이 붙어 있고, 수로를 타야만 들어갈 수 있는 지하 도박장 홍등루가 그 아래에 있다. 이 동의 붉은 등은 꺼지는 날이 없다.',
 '3동 종루동(鐘樓)은 삼경이 지키는 동이다. 꼭대기에 녹슨 종이 매달린 종루가 있고, 아래쪽에는 삼경 의원과 수칙을 찍어 내는 인쇄소가 있다.',
 '4동 빈동(空樓)은 이름 그대로 거의 비어 있다. 간판 불은 대부분 꺼졌고 폐업한 치과와 멈춘 공방 정도만 남았다. 사람들은 숫자 4를 꺼리는 것처럼 이 동에 발을 들이는 것도 꺼린다.',
 '동마다 위로는 옥상과 안테나 숲이 있고, 아래로는 바닷물이 스며드는 수로가 흐른다. 성채에서 하늘이 보이는 곳은 옥상밖에 없고, 바깥으로 빠져나가는 건 수로의 물밖에 없다.',
 '바깥 사람들은 성채를 조금씩 잊어 가고 있다. 레이란 라디오는 성채 이야기를 하지 않고, 시내 지도에서 이 구역은 회색으로 칠해져 있을 뿐이다. 성채 사람들 중에는 그게 차라리 낫다는 사람도 있고, 그게 더 무섭다는 사람도 있다.']],
['밤의 증축',['새벽 세 시가 되면 성채 어딘가에서 망치 소리가 나기 시작한다.',
 '쿵, 쿵, 쿵. 벽 안쪽에서 울릴 때도 있고, 천장 위에서 들릴 때도 있고, 바로 옆방에서 나는 것처럼 가까울 때도 있다. 소리가 이어지는 동안 복도에는 덜 마른 시멘트 냄새가 퍼지고, 형광등이 하나씩 꺼져 간다. 그러다 네 시가 다가오면 언제 그랬냐는 듯 소리가 뚝 그친다.',
 '아침이 되면 성채는 어제와 조금 달라져 있다. 어제 없던 계단이 생기거나, 복도 끝에 처음 보는 문이 하나 늘어 있거나, 누군가의 방이 한 뼘쯤 좁아져 있다. 새로 생긴 계단은 하루 동안만 열려 있고, 다음 날 아침이면 그 자리가 다시 벽으로 막혀 있다.',
 '누가 짓는 건지는 아무도 모른다. 적등방 사람들도 모른다고 하고 삼경 사람들도 모른다고 한다. 성채에서 오래 산 노인들은 다만 이런 말을 한다. 증축이 있었던 다음 날에는 꼭 누군가 한 사람이 보이지 않는다고.',
 '그래서 백계성 주민 수칙의 첫 번째 줄에는 이렇게 적혀 있다. 「새벽 3시에서 4시 사이 망치 소리가 들리면 방에 머물 것. 누가 두드려도 문을 열지 말 것.」']],
['적등방(赤燈幫)',['홍등동 골목에 붉은 등이 걸린 곳은 모두 적등방의 구역이다. 그 불빛 아래서 벌어지는 일은 적등방이 책임지고, 적등방이 정리한다. 대놓고 그렇게 말하는 사람은 없어도 성채 사람이라면 다 알고 있다.',
 '적등방은 백계성의 범죄 조직이다. 성채에서 오가는 돈 대부분이 한 번은 이들의 손을 거친다.',
 '돈이 급한 사람에게는 돈을 빌려준다. 이자는 무겁고, 장부는 사무실 금고 안에 있다. 장부에 이름이 올라간 사람은 그날부터 적등방의 객이 된다. 홍등루의 마작판은 밤낮없이 돌아가는데, 판돈 대신 사람을 거는 테이블이 있다는 소문도 있다. 홍등동의 국숫집과 전당포, 차찬텡은 달마다 봉투를 낸다. 봉투를 내지 않은 가게는 얼마 안 가 간판 불이 꺼진다. 레이란 항구로 들어온 물건 중 세관을 거치지 않은 것들도 수로를 타고 성채로 흘러든다. 그게 누구 물건인지는 아무도 묻지 않는다.',
 '적등방 안에도 위아래가 있다. 빚을 지고 들어온 객(客)은 잡일과 심부름을 하면서 빚을 갚아 나간다. 빚을 절반까지 줄이고 공을 쌓으면 붉은 등을 들 자격이 생기는데, 이들을 등잡이라고 부른다. 등잡이는 다시 주먹을 쓰는 홍봉(紅棒)이나, 장부와 수금을 맡는 백선(白扇) 중 한 길로 간다. 한 구역을 통째로 맡아 보호비를 걷는 사람은 향주(香主)라고 불리고, 그 위에는 방주(幫主)가 있다. 성채 사람이라면 누구나 방주의 얼굴을 알지만, 가까이 가 본 사람은 없다.',
 '적등방에서 지켜야 하는 철칙은 하나뿐이다. 빚은 반드시 갚아야 한다. 돈이 없으면 일로 갚고, 일로도 안 되면 몸으로 갚는다. 사무실 장부 맨 뒤에는 금액 대신 혈액형과 키, 몸무게를 적는 칸이 따로 있다. 그 칸에 서명한 사람은 하룻밤 만에 빚이 줄어서 돌아오는데, 다들 옆구리에 붕대를 감고 있다. 같은 층 복래 정육점의 냉동고 안쪽 칸이 무엇을 넣어 두는 곳인지는 아무도 묻지 않는다.',
 '들어오는 건 쉽다. 장부에 서명 한 번만 하면 된다. 하지만 나가는 건 거의 불가능하다. 적등방을 나가겠다고 말을 꺼낸 사람은 많지 않았고, 실제로 나간 사람은 그보다도 적다. 나간 사람 중 몇은 손가락이 모자라고, 몇은 한쪽 눈이 없다. 나머지는 수로에서 발견되었다. 몰래 빠져나간 사람은 도망자가 되는데, 붉은 완장을 찬 사내들이 그 얼굴이 그려진 종이를 들고 한 달 동안 성채를 뒤지고 다닌다.',
 '그런데도 사람들은 제 발로 적등방을 찾아온다. 경찰도 법도 없는 곳에서 적등방은 한 번 한 약속만큼은 지키기 때문이다. 돈이 필요하면 빌려주고, 봉투를 낸 가게는 지켜 주고, 자기 구역에서 일어난 일은 밖으로 새어 나가지 않게 덮어 준다. 그래서 백계성 사람들은 적등방을 무서워하면서도, 적등방이 없는 성채는 잘 상상하지 못한다.']],
['삼경(三更)',['삼경은 밤 열한 시부터 새벽 한 시 무렵, 하룻밤 중에서 가장 깊은 시간을 가리키는 말이다. 백계성에서는 그 시간에 깨어 있는 사람들을 부르는 이름이기도 하다.',
 '삼경은 백계성의 자경단이다. 경찰이 들어오지 않는 성채에서 주민들이 직접 꾸린 야경꾼 모임으로 시작했다고 한다. 완장은 쓸 만한 천이면 아무거나 상관없고, 가진 거라고는 손전등과 호루라기, 수칙이 적힌 종이 다발이 전부다.',
 '삼경이 하는 일은 크게 세 가지다. 먼저 순찰이다. 다들 방에 틀어박혀 있어야 하는 증축 시간에도 삼경은 밖에 나가 있다. 망치 소리가 어디서 나는지, 어느 복도에 새 문이 생겼는지 귀를 기울이고 받아 적는다.',
 '다음은 수칙이다. 계단참마다 붙어 있는 주민 수칙을 찍어서 붙이고, 낡으면 새로 붙인다. 수칙을 어겼다고 벌을 주지는 않지만, 어긴 사람에게 무슨 일이 생겼는지는 빠짐없이 기록해 둔다.',
 '마지막은 수색이다. 사라진 사람을 찾아다니고, 끝내 찾지 못하면 삼경 의원 게시판에 실종 전단을 붙인다. 새로 생긴 계단에는 못을 박아 사람이 오르지 못하게 막는다.',
 '삼경에 갓 들어온 사람은 신참이라고 한다. 순찰과 현장 수습을 꾸준히 해내면 조 하나를 맡는 조장이 되고, 삼경 전체를 이끄는 사람은 대장이라고 부른다. 삼경은 돈을 많이 주지 않는다. 대신 삼경 완장을 차고 있으면 성채 사람들이 문을 열어 준다. 한밤중에 누가 문을 두드려도, 그게 삼경이면 연다.',
 '삼경 대원들은 만나면 「오늘도 세어 봤어?」 하고 인사를 나눈다. 계단 이야기를 하는 것 같기도 하고, 사람 이야기를 하는 것 같기도 하다.']],
['붉은 등과 종소리',['백계성에는 질서가 두 개 있다. 하나는 돈으로 돌아가고, 다른 하나는 수칙으로 돌아간다. 이 둘은 지금까지 한 번도 사이가 좋았던 적이 없다.',
 '적등방 쪽에서 보면 삼경은 장사를 방해하는 참견꾼들이다. 삼경이 의원 게시판에 붙여 놓은 실종 전단을 보면, 그 얼굴 중 절반은 적등방 장부에도 이름이 올라 있다. 삼경이 그 이야기를 꺼낼 때마다 홍등동의 붉은 등이 하나씩 더 켜진다.',
 '삼경 쪽에서 보면 적등방은 성채를 갉아먹는 사람들이다. 사람을 빚으로 묶어 두고, 그렇게 묶인 사람에게 하필 증축 시간에 심부름을 시킨다. 그렇게 나간 사람 가운데 몇은 끝내 돌아오지 않았다.',
 '증축을 대하는 방식도 정반대다. 적등방에게 새로 생긴 방은 새 구역이고, 새 가게고, 새로 걷을 보호비다. 그러니 누구보다 먼저 가서 깃발을 꽂아야 한다. 삼경에게 새로 생긴 방은 누군가 사라진 자리다. 그러니 누구보다 먼저 가서 못을 박아 막아야 한다.',
 '그래서 밤마다 비슷한 일이 되풀이된다. 새 계단이 생기면 붉은 완장과 삼경 완장이 거의 같은 시각에 그 앞에 도착한다. 대개는 한참 노려보다가 각자 돌아선다. 하지만 가끔은 그러지 않는다. 그런 밤에는 종루의 종이 세 번 울리고 홍등동의 불이 한꺼번에 꺼진다. 다음 날 아침 계단참에는 물이 흥건하게 고여 있고, 어느 쪽도 간밤에 무슨 일이 있었는지 입을 열지 않는다.',
 '그래도 두 세력 사이에 말로 정한 적은 없는 약속이 하나 있다. 정문 골목에서는 서로 손대지 않는다는 것이다. 바깥으로 이어지는 하나뿐인 골목에서 피가 흐르면 레이란 경찰에게 정문을 넘어올 핑계를 주게 되기 때문이다. 그래서 정문 차찬텡 창가 자리에는 가끔 붉은 완장과 삼경 완장이 나란히 앉아 밀크티를 마신다. 둘 다 끝까지 상대 쪽으로는 고개를 돌리지 않는다.',
 '성채 사람들은 그 둘 사이에서 하루하루를 산다. 낮에는 적등방에 봉투를 내고, 밤에는 삼경에게 문을 열어 준다. 어느 한쪽에 완전히 기대지 않고 버티는 사람이 백계성에서 오래 산다고들 한다.']],
['무소속',['어느 쪽에도 속하지 않은 사람들도 있다. 장부에 이름이 없고 완장도 차지 않은 사람들이다. 대부분 정문동 철창 하숙에서 철망 문 하나를 사이에 두고, 옆 칸 사람의 숨소리까지 들으며 지낸다.',
 '무소속에게는 번듯한 주소도, 정해진 생업도 없다. 신문을 돌리거나 짐을 나르거나 남의 빨래를 널어 주면서 하루하루를 버틴다. 그 대신 누구에게도 빚진 게 없고, 누구의 말도 듣지 않아도 된다.',
 '그렇다고 마음 편하게 사는 건 아니다. 적등방은 무소속을 언젠가 장부에 오를 사람으로 보고, 삼경은 언젠가 실종 전단에 오를 사람으로 본다. 무소속으로 오래 버틴 사람은 드물다.',
 '무소속이 고를 수 있는 길은 몇 가지가 있다. 홍등루에서 빚을 지고 적등방의 객이 되거나, 평판을 쌓아서 삼경 완장을 차거나, 주인 없는 문패를 구해 성채 어딘가에 자기 주소를 걸거나.',
 '적등방에서 도망친 사람도 무소속이 된다. 다만 그 사람들 이름 뒤에는 도망자라는 말이 하나 더 붙는다. 그들이 홍등동에 발을 들이면 붉은 등 아래 누군가가 그 이름을 부른다.']],
['주민 수칙과 숫자 4',['계단참마다 누렇게 바랜 종이가 한 장씩 붙어 있다. 백계성 주민 수칙이다. 지금은 삼경이 찍어서 붙이고 있지만, 맨 처음 누가 썼는지는 삼경도 모른다.',
 '수칙은 지켜도 되고 어겨도 된다. 다만 어긴 뒤에 무슨 일이 생기든 책임져 주는 사람은 없다. 수칙을 어긴 사람은 가끔 이상한 물건을 손에 쥐고 돌아오는데, 사람들은 그걸 밤물건이라고 부른다. 전당포 노인은 그게 어디서 났는지 묻지 않고 값을 쳐 준다.',
 '종이에 적혀 있지 않은 수칙도 있다. 직접 겪어 본 사람만 알고, 겪은 사람은 자기 수첩에 손글씨로 적어 둔다. 그리고 종이에 적힌 수칙 중 하나는 틀렸다는 소문이 있다. 어느 것이 틀렸는지는 아무도 모른다.',
 '성채에는 13층이 없다. 어느 동이든 12층 다음은 바로 14층이다. 그런데 4동 12층과 14층 사이의 계단참만은 이상하게 길다. 사람들은 숫자 4도 피한다. 국숫집 4번 테이블에는 앉지 않고, 4동에는 살지 않고, 삐삐에 모르는 번호로 0404가 찍히면 답하지 않는다.']],
['시대',['때는 1980년대 끝무렵이다. 레이란 시내에는 빨간 이층버스가 다니고, 레코드 가게에서는 광둥어 유행가가 흘러나오고, 주말이면 경마장에 사람들이 몰린다. 바다 건너에서는 몇 년 뒤면 이 도시의 주인이 바뀐다는 이야기가 오가고, 그 때문인지 도시 전체가 어딘가 들떠 있으면서도 불안하다.',
 '성채 안의 시간은 바깥보다 조금 늦게 흐른다. 허리에는 삐삐를 차고, 급한 연락은 정문 골목 녹색 공중전화로 한다. 집집마다 브라운관 텔레비전에서 무협 드라마가 나오고, 카세트 라디오에서는 늘어진 테이프 소리가 난다. 비디오 가게에는 제목 없는 테이프가 쌓여 있고, 천장에서는 녹슨 선풍기가 미지근한 바람을 돌린다.',
 '레이란 공항으로 내려오는 여객기는 백계성 지붕 바로 위를 스치듯 지나간다. 비행기가 지나갈 때마다 창문이 덜덜 떨리고 텔레비전 화면이 흔들려서, 성채 사람들은 말을 하다가도 잠깐 입을 다물고 소리가 지나가기를 기다린다. 옥상에 올라가면 비행기 배가 손에 닿을 것처럼 보인다.',
 '성채 안에는 바깥에서는 허가를 받을 수 없는 가게들이 빼곡하다. 면허 없는 치과와 한약방, 간판 없는 이발소, 하루 종일 기계가 돌아가는 어묵 공장과 국숫집. 골목 위로는 전선이 거미줄처럼 엉켜 있고, 수도관에서 새는 물이 계단을 타고 흘러내린다. 햇빛이 들지 않는 복도는 낮에도 형광등을 켜 둬야 하고, 그 형광등은 늘 어딘가 하나씩 깜빡인다.',
 '벽마다 붉은색과 초록색 한자 간판이 겹겹이 붙어 있다. 비가 오면 네온 불빛이 젖은 바닥에 번져서, 골목 전체가 물속에 잠긴 것처럼 보인다. 그 아래로 사람들은 오늘도 계단을 올라 집으로 돌아간다.',
 '바깥에서는 몇 년째 성채를 허문다는 말이 돈다. 레이란 신문에 가끔 그런 기사가 실리고, 정부 사람들이 정문 앞에 와서 사진을 찍어 가기도 한다. 하지만 성채 안에서 그 이야기를 진지하게 하는 사람은 없다. 허물기 전에 성채가 먼저 자랄 거라고, 노인들은 그렇게 말하며 웃는다.']]];

const sndOn=()=>G.opts.sound!==false;
const sndVol=()=>G.opts.vol==null?0.6:G.opts.vol;
function acInit(){if(AC)return AC;const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{AC=new C();MASTER=AC.createGain();MASTER.gain.value=sndVol();MASTER.connect(AC.destination);
  const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;NOISE=buf}catch(e){AC=null}return AC}
let SILENT_EL=null;
function unlockAudio(){if(!sndOn())return;try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  const c=acInit();if(!c)return;
  /* 아이폰 무음 스위치를 켜 둬도 소리가 나도록, 아주 짧은 무음 오디오를 같이 튼다 */
  if(!SILENT_EL){try{SILENT_EL=new Audio('data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA');SILENT_EL.loop=true;SILENT_EL.setAttribute('playsinline','');SILENT_EL.volume=0.01}catch(e){}}
  if(SILENT_EL&&SILENT_EL.paused){const p=SILENT_EL.play();if(p&&p.catch)p.catch(()=>{})}

function jobLabel(j){const d=JOBS[j];if(!d)return j;return `${j} · ${STATS.find(s=>s[0]===d[1])[1]} · $${d[2]}`}
function jobSel(c){const list=jobsFor(c);if(c.job&&!list.includes(c.job))list.unshift(c.job);const s=document.createElement('select');s.id='f-job';
  for(const[v,l]of[['','없음'],...list.map(j=>[j,jobLabel(j)])]){const o=document.createElement('option');o.value=v;o.textContent=l;s.append(o)}s.value=c.job||'';return s}
function startWork(){if(!ready())return;const m=G.me;if(!m.job)return toast('생업이 없어요. 일용직 게시판에서 일을 찾아보세요.');if(m.work)return;
  m.work={until:T()+(fast()?60e3:4*HOUR),job:m.job};log(`${m.job} 일하러 나갔다.`,'work');save();render()}
function finishWork(){const m=G.me,w=m.work;m.work=null;const pay=PAY[w.job]||40;m.money+=pay;const line=chance(.4)?pick(WORKLINES[w.job]||['별일 없었다.']):'별일 없었다.';
  const extra=m.fac==='red'?give({merit:3}):m.fac==='sam'&&w.job==='야간 순찰'?(give({sam:{patrol:1}}),['순찰 +1']):[];
  const sg=gainStat(JOBSTAT[w.job]||'str',4);log(`퇴근. $${pay}. ${line}${sg?' ('+sg+')':''}`,'work');toast(`퇴근했어요. $${pay}`)}

function nap(){if(!ready())return;const m=G.me;if(m.cell!==homeCell(m))return toast('낮잠은 집 칸에서만 잘 수 있어요.');const dl=daily();if(dl.nap>=2)return toast('오늘은 더 잠이 오지 않아요.');
  dl.nap++;m.nap={until:T()+(fast()?60e3:HOUR),build:isBuild()};log('낮잠을 청했다.','life');save();render()}
function finishNap(){const m=G.me,b=m.nap.build||isBuild();m.nap=null;const out=give({en:6,mind:3});let txt='눈을 떴다. 형광등이 한 번 깜빡였다.';
  if(b||chance(.12)){if(chance(.5)){out.push(...give({clue:1}));txt='꿈에서 누군가 설계도를 펼쳐 보여 줬다. 깨어 보니 손에 종이 조각이 쥐여 있다.'}else{out.push(...give({fx:'delirium'}));txt='꿈에서 내 방에 문이 하나 더 있었다. 깨어 보니 벽에 손톱자국이 있다.'}}
  log('낮잠에서 깼다. '+out.join(', '),'life');result={title:'낮잠',text:txt,lines:out,bad:false};toast('낮잠에서 깼어요. 기력 +6')}

function stim(price,where){const m=G.me;if(!ready())return;const dl=daily();if(dl.stim>=2)return toast('하루에 두 번까지만 쓸 수 있어요. 손이 떨린다.');if(m.money<price)return toast('돈이 모자라요.');
  m.money-=price;dl.stim++;const out=give({en:4,mind:-10});if(chance(.25))out.push(...give({fx:'delirium'}));log(`${where}에서 각성제를 샀다.`,'life');closeModal();done('각성제','쓴맛이 혀 밑에 오래 남는다. 심장이 계단을 두 칸씩 뛰어오른다.',out,true)}

     if(m.money<b*mjMul()){if(m.fac==='red'&&!m.fugitive){m.debt+=b;m.money+=b;log(`마작 판돈 $${b}을 빚으로 걸었다.`,'fac')}else{toast('돈이 모자라요.');return}}
     m.money-=b*mjMul();mjDeal(b)}})).concat(m.money<10*mjMul()?[{l:'돈 대신 피를 건다 (채혈마작)',run:bloodMJ}]:[]).concat([{l:'일어선다',run:()=>done('홍등루','등 뒤에서 패 섞는 소리가 계속됐다.',[])}])})}
function mjDraw(){return chance(.04)?0:ri(1,9)}
function mjDeal(bet){const mine=mjDraw();openScene({id:'mj2',title:'홍등루 · 마작 한 판',red:true,text:`내 패는 ${tile(mine)}.`+(mine===0?'\n아무것도 그려지지 않은 패. 이 판에 있을 리 없는 패다.':'')+`
판돈 $${bet}.`,choices:[
  {l:'이대로 간다',run:()=>mjEnd(bet,mine)},{l:'한 번 바꾼다',run:()=>mjEnd(bet,mjDraw(),mine)}]})}
function mjEnd(bet,mine,old){const m=G.me,dealer=ri(1,9);let txt=(old!=null?`${tile(old)}을(를) 버리고 ${tile(mine)}을(를) 받았다.
`:'')+`딜러의 패는 ${tile(dealer)}.`;const out=[];
  if(mine===0){txt+='\n\n딜러가 내 패를 보더니 말없이 판을 접는다. 그리고 내 맞은편 빈자리를 향해 고개를 숙인다. 「네 번째 분, 오셨습니까.」';out.push(...give({money:bet,mind:-12}));log('마작에서 백(白) 패를 받았다.','haunt');done('백(白)',txt,out,true);return}
  if(mine>dealer){let win=bet*2;if(m.fac==='red'&&!m.fugitive){const cut=Math.round(win*.1);win-=cut;out.push(...give({merit:1}));txt+=`

이겼다. 방에 몫 $${cut}을 떼어 줬다.`}else txt+='\n\n이겼다. 딜러가 웃지 않는다.';out.unshift(...give({money:win}));log(`마작에서 $${win}을 땄다.`,'life');done('마작',txt,out)}
  else{txt+=mine===dealer?'\n\n같은 패. 딜러가 이긴다.':'\n\n졌다.';log(`마작에서 $${bet}을 잃었다.`,'life');out.push(`$-${bet}`);done('마작',txt,out,true)}}

  {n:'홍등루 판 감시',s:'sen',dc:11,rw:{money:30,merit:6},fail:{merit:-2},ok:['패를 소매에 숨기는 손을 잡았다. 그 손님은 다음 날부터 보이지 않았다.','밤새 지켜봤다. 구석 빈 테이블의 패가 혼자 바뀌는 것만 빼면 깨끗한 판이었다.'],no:['아무것도 못 봤는데 판이 깨졌다. 내 탓이 됐다.','한눈판 사이 판돈 봉투 하나가 사라졌다.']},
  {n:'수로 밀수 운반',s:'agi',dc:13,rw:{money:60,merit:10},fail:{hp:-12},ok:['젖은 상자를 지고 수로를 건넜다. 상자 안에서 무언가 두 번 두드렸다. 열지 않았다.','정문 배수로까지 무사히 옮겼다. 바깥 사람이 상자를 받으며 성채를 올려다보지 않으려 애쓴다.'],no:['수로에서 미끄러져 상자를 놓쳤다. 물속으로 가라앉는 상자에서 거품이 올라왔다.','삼경 순찰과 마주쳐 돌아서 왔다. 정강이가 수로 벽에 찢겼다.']},
  {n:'보호비 걷기',s:'str',dc:12,rw:{money:35,merit:8},fail:{credit:-3},ok:['전파상 주인이 말없이 봉투를 내민다. 라디오가 일제히 볼륨을 낮춘다.','국숫집은 늘 제일 먼저 낸다. 주인은 봉투와 함께 꼭 국수 한 그릇을 싸 준다.'],no:['재봉 공장 아주머니들이 버텼다. 한 명이 끝까지 눈을 피하지 않았다.','셔터가 내려가 있었다. 셔터 너머에서 숨소리가 들렸다.']},
  {n:'밤물건 감정 보조',s:'sen',dc:12,rw:{money:30,merit:6,credit:2},fail:{mind:-6},ok:['깨진 거울 조각을 감정했다. 진짜다. 비친 감정사의 얼굴이 조금 늦게 웃었다.','물건 장부를 정리했다. 「네 번째 그릇」 가격 칸만 비어 있다.'],no:['가짜를 진짜로 봤다. 감정사가 혀를 찬다.','물건 하나를 만지자 손끝이 한동안 차가웠다.']},
  {n:'도망 간 객 탐문',s:'talk',dc:13,rw:{money:45,merit:10},fail:{mind:-5},ok:['국숫집 주인이 국수를 말며 입을 연다. 「정문 쪽 하숙. 3층 끝.」','하숙집 노파가 담배 한 갑에 입을 열었다. 이름 칸이 빈 방 번호.'],no:['다들 모른다고 한다. 너무 똑같은 말투로.','물어볼 때마다 사람들이 같은 방향을 피해 본다. 4동 쪽.']},
  {n:'마작방 손님 접대',s:'talk',dc:10,rw:{money:25,merit:5},fail:{money:-5},ok:['바깥에서 온 손님에게 차를 따르고 패를 섞었다. 손님이 팁을 두고 갔다. 「여기 좋네. 근데 왜 계단이 이렇게 많아?」','손님이 판을 크게 잃고도 웃으며 나갔다. 나가는 길에 계단에서 한참 헤맸다고 한다.'],no:['손님이 성질을 냈다. 찻잔 값은 내 몫이 됐다.']},
  {n:'장부 옮겨 적기',s:'sen',dc:10,rw:{money:25,merit:4,credit:3},fail:{mind:-4},ok:['숫자를 옮겨 적었다. 지워진 이름 하나가 자꾸 눈에 걸린다. 지워진 자국 위로 내 이름 같은 획.','밤새 장부를 옮겼다. 마지막 장에 아직 빚이 생기지 않은 사람들 이름이 미리 적혀 있다.'],no:['숫자 하나를 잘못 옮겼다. 그 사람 빚이 늘었다. 고칠 수 없다고 한다.']},
  {n:'경쟁 조직 낙서 지우기',s:'str',dc:10,rw:{money:20,merit:5},fail:{hp:-4},ok:['홍등 골목 벽에 칠해진 「흑수회」 글자를 지웠다. 지운 자리 아래 더 오래된 글씨가 나왔다. 「백계」.','낙서를 지우다 보니 지운 만큼 반대편 벽에 같은 글자가 생겼다. 그것까지 지웠다.'],no:['페인트가 지워지지 않는다. 문지를수록 번진다. 손바닥이 빨갛게 됐다.']},
  {n:'국숫집 4번 자리 지키기',s:'nerve',dc:12,rw:{money:50,merit:12},fail:{mind:-14},ok:['향주의 명령이다. 밤새 4번 테이블 옆에 서서 아무도 앉지 못하게 했다. 아무도 앉지 않았다. 아무도 보이지 않았다.','새벽 세 시, 4번 의자가 한 번 빠졌다가 들어갔다. 못 본 척했다.'],no:['자정쯤 깜빡 졸았다. 눈을 뜨니 4번 테이블에 빈 그릇이 놓여 있었다.']},
 ],
 sam:[
  {n:'4동 순찰',s:'nerve',dc:12,rw:{money:25,sam:{patrol:1}},fail:{mind:-10},ok:['손전등 하나로 4동 상층을 돌았다. 열린 문을 세 개 닫았다. 돌아오는 길에 하나가 다시 열려 있었다.','순찰 일지에 「이상 없음」이라고 적었다. 다 적고 보니 내 글씨 아래 누가 「있음」이라고 덧붙여 놓았다.'],no:['순찰 중 손전등이 꺼졌다. 다시 켜졌을 때 한 층을 건너뛰어 있었다.','같은 복도를 세 번 돌았다. 네 번째에야 계단이 나왔다.']},
  {n:'수칙 위반 현장 수습',s:'nerve',dc:13,rw:{money:30,sam:{cleanup:1}},fail:{mind:-12},ok:['문패 없는 집 앞에서 주저앉은 사람을 데려왔다. 그 사람은 집에 오는 내내 「저예요」라고 중얼거렸다.','엘리베이터를 탔다는 사람을 찾았다. 신발 한 짝만 신고 6층 계단참에 서 있었다.'],no:['현장에 도착했을 때 아무도 없었다. 바닥에 젖은 발자국만.','수습하는 동안 내 이름을 누가 계속 불렀다. 끝까지 돌아보지 않았다. 정신이 너덜너덜하다.']},
  {n:'실종자 전단 붙이기',s:'agi',dc:10,rw:{money:20,sam:{patrol:1}},fail:{mind:-4},ok:['계단참마다 전단을 붙였다. 마지막 전단을 붙이다 보니 아래 붙은 전단 사진이 지금 붙인 사람과 같다. 30년 차이.','전단을 다 붙이고 돌아오는 길, 붙인 전단 몇 장이 벌써 떼어져 있다. 누가 가져갔는지는 모른다.'],no:['전단 뭉치를 수로에 빠뜨렸다. 물에 젖은 얼굴들이 둥둥 떠내려갔다.']},
  {n:'의원 야간 보조',s:'sen',dc:11,rw:{money:28,hp:5},fail:{mind:-5},ok:['밤새 붕대를 감았다. 환자 하나가 고맙다며 이를 내밀었다. 받지 않았다.','섬망 환자의 손을 잡고 있었다. 새벽쯤 그 사람이 내 이름을 처음 제대로 불렀다.'],no:['약을 잘못 건넸다. 마리솔이 말없이 바꿔 줬다.']},
  {n:'새 계단 봉인 (새 계단의 못 1)',s:'nerve',dc:12,need:'nail',rw:{money:40,sam:{seal:1}},fail:{mind:-15},ok:['새 계단 첫 칸에 못을 박았다. 못이 다 들어가자 계단 위쪽에서 무언가 멈추는 소리가 났다.','봉인을 마쳤다. 계단은 그대로 있지만 이제 아무도 오르지 않는다. 오를 수 없다.'],no:['못을 박는 동안 계단 위에서 누가 내려왔다. 봉인은 끝냈지만 그 사람을 보고 말았다.']},
  {n:'종 줄 점검',s:'str',dc:10,rw:{money:20,sam:{patrol:1}},fail:{hp:-5},ok:['종 줄을 새것으로 바꿨다. 다음 날 아침, 줄은 또 다른 새것이었다. 우리가 바꾼 건 아닌데.','종을 닦았다. 종 안쪽에 새겨진 날짜가 하나 늘었다.'],no:['줄을 당기다 손바닥이 쓸렸다. 종이 반 박자 늦게 울렸다.']},
  {n:'수칙 문서 새로 붙이기',s:'agi',dc:10,rw:{money:18,sam:{patrol:1},rep:1},fail:{mind:-3},ok:['계단참 게시판마다 새 수칙을 붙였다. 4동 어느 게시판엔 이미 다른 판본이 붙어 있었다. 떼어 냈다. 9번 수칙이 있었다.','붙이고 돌아서면 누가 3번 수칙에 줄을 그어 놓는다. 세 번째에 그만두었다.'],no:['수칙 문서를 거꾸로 붙인 걸 나중에야 알았다. 아무도 고치지 않았다.']},
  {n:'섬망 환자 돌보기',s:'talk',dc:11,rw:{money:25,sam:{cleanup:1}},fail:{mind:-8},ok:['환자에게 오늘 날짜와 층수를 계속 말해 줬다. 저녁쯤 환자가 처음으로 「몇 층이에요?」라고 묻지 않았다.','환자가 내 얼굴을 보고 다른 이름을 불렀다. 그 이름에 대답해 주었다. 그제야 잠들었다.'],no:['환자가 내 말을 따라 했다. 내 목소리로. 그 뒤로 한동안 내 목소리가 낯설었다.']},
  {n:'우물 뚜껑 확인',s:'sen',dc:10,rw:{money:20,sam:{patrol:1}},fail:{mind:-6},ok:['뚜껑은 잘 닫혀 있다. 수칙도 젖지 않았다. 뚜껑 위에 놓인 작은 신발 한 짝만 빼면.','뚜껑을 확인하고 돌아서는데 안에서 똑똑 두 번. 대답하지 않았다.'],no:['뚜껑이 조금 열려 있었다. 닫으려는데 아래에서 밀었다.']},
  {n:'정문 야간 경계',s:'nerve',dc:11,rw:{money:28,sam:{patrol:1},rep:1},fail:{mind:-6},ok:['밤새 정문을 지켰다. 새벽 세 시, 바깥에서 누가 들어오려다 문턱 앞에서 멈췄다. 한참 서 있다가 돌아갔다.','바깥에서 온 택시 한 대가 정문 앞에 섰다. 아무도 내리지 않았다. 기사도 없었다.'],no:['졸았다. 깨어 보니 정문 안쪽에 낯선 발자국이 한 줄. 들어오기만 했다.']},
 ],
 free:[
  {n:'짐 나르기',s:'str',dc:10,rw:{money:25,rep:3},fail:{hp:-6},ok:['14층까지 쌀 포대를 날랐다. 할머니가 고맙다며 박하사탕 세 개를 쥐여 줬다.','이삿짐을 날랐다. 짐은 4동에서 1동으로. 이사 가는 사람이 「저기는 이제 못 살겠어요」라고만 했다.'],no:['계단에서 짐을 놓쳤다. 굴러 떨어진 상자에서 사진 액자가 깨졌다.']},
  {n:'골목 배달',s:'agi',dc:10,rw:{money:22,rep:3},fail:{mind:-3},ok:['국수 배달을 열 군데 돌았다. 마지막 집은 문패가 없었는데 그릇이 깨끗하게 비어 나왔다.','약 봉투를 배달했다. 받는 사람이 문을 손 하나 들어갈 만큼만 열었다.'],no:['주소를 잘못 찾았다. 엉뚱한 집 사람이 그래도 받아 갔다. 「우리 집 맞아요.」']},
  {n:'전파상 수리 보조',s:'sen',dc:11,rw:{money:28,rep:4},fail:{money:-5},ok:['라디오 진공관을 갈았다. 켜자마자 「고쳐 줘서 고마워」 하는 목소리. 방송이 아니었다.','삐삐 다섯 개를 고쳤다. 다섯 개 모두 같은 번호를 띄우며 켜졌다.'],no:['부품 하나를 태웠다. 수리비는 내 몫이다.']},
  {n:'통역',s:'talk',dc:11,rw:{money:30,rep:4},fail:{rep:-1},ok:['바다 건너온 선원과 적등방 사이에서 말을 옮겼다. 둘 다 내가 말을 조금씩 순하게 바꾼 걸 몰랐다.','전당포에서 외국인 손님과 주인 사이를 통역했다. 손님이 맡긴 반지 안쪽엔 성채 주소가 새겨져 있었다.'],no:['단어 하나를 잘못 옮겼다. 분위기가 싸해졌다. 양쪽 다 나를 노려봤다.']},
  {n:'배급 줄 대신 서기',s:'nerve',dc:9,rw:{money:18,rep:2},fail:{mind:-4},ok:['두 시간 줄을 섰다. 앞사람이 계속 뒤를 돌아봤다. 내 뒤엔 아무도 없었는데.','배급을 받아 왔다. 봉투 무게가 하나 더 무거웠다.'],no:['줄이 끝나지 않는다. 앞사람 뒤통수가 계속 같은 뒤통수다.']},
  {n:'밤물건 중개',s:'talk',dc:13,rw:{money:45,rep:6},fail:{money:-10},ok:['적등방 감정사와 삼경 대원 사이에서 거래를 맞췄다. 둘 다 서로 얼굴은 보지 않았다.','물건을 넘기고 돈을 받았다. 물건을 판 사람은 그 물건이 어디서 났는지 기억하지 못했다.'],no:['중간에서 값을 잘못 불렀다. 차액은 내가 메웠다.']},
  {n:'어묵 공장 대타',s:'str',dc:11,rw:{money:32,rep:3},fail:{hp:-8},ok:['반나절 반죽을 치댔다. 공장장이 어묵 한 봉지를 싸 줬다. 손에서 사흘 동안 생선 냄새가 났다.','튀김 솥 앞에 서 있었다. 기름 위로 떠오르는 거품이 자꾸 얼굴 모양이다.'],no:['기름이 튀었다. 팔에 물집이 잡혔다.']},
  {n:'빨래 걷기 대행',s:'agi',dc:9,rw:{money:15,rep:2},fail:{mind:-3},ok:['비 오기 전에 옥상 빨래 열두 집 몫을 걷었다. 한 집 빨래가 한 벌 남는다. 주인이 없다.','빨래를 다 걷었다. 빈 빨랫줄이 바람도 없는데 흔들린다.'],no:['빨래 한 벌이 바람에 날아갔다. 4동 옥상 쪽으로.']},
  {n:'고양이 찾기',s:'sen',dc:11,rw:{money:25,rep:3},fail:{mind:-5},ok:['4동 빈 집 장롱에서 고양이를 찾았다. 장롱 안쪽 벽에 아이 키 눈금이 그어져 있다.','고양이는 종루 꼭대기에 있었다. 종 안쪽을 올려다보며 울고 있었다.'],no:['고양이를 찾다가 다른 고양이를 찾았다. 주인이 이 고양이는 3년 전에 죽었다고 한다.']},
  {n:'사진관 모델',s:'talk',dc:9,rw:{money:20,rep:2},fail:{mind:-4},ok:['사진관 쇼윈도 사진 모델을 섰다. 사진사가 셔터를 누를 때마다 내 뒤를 본다.','사진이 잘 나왔다. 배경 계단에 서 있는 사람 하나만 빼면.'],no:['웃으라고 해서 웃었는데, 현상한 사진 속 나는 울고 있다.']},
 ],

function boardFor(fac,di=dayIdx(T())){const m=G.me;const extra=m&&m.reroll&&m.reroll.d===di?(m.reroll[fac]||0):0;const list=QUESTS[fac],r=rng(di*13+fac.length*7+extra*101);const idx=[...list.keys()].sort(()=>r()-.5).slice(0,3);return idx.map(i=>({...list[i],key:`${di}:${fac}:${extra}:${i}`}))}
function rerollCost(fac){const m=G.me,di=dayIdx(T());const n=m.reroll&&m.reroll.d===di?(m.reroll[fac]||0):0;return 10+n*10}
function reroll(fac){if(!ready())return;const m=G.me,di=dayIdx(T()),c=rerollCost(fac);if(m.money<c)return toast(`$${c}이 필요해요.`);m.money-=c;if(!m.reroll||m.reroll.d!==di)m.reroll={d:di};m.reroll[fac]=(m.reroll[fac]||0)+1;log(`${fac==='free'?'일용직 게시판':FACS[fac]+' 의뢰판'}을 새로 받았다. $${c}`,'fac');toast('의뢰판이 바뀌었어요.');save();render()}
function doQuest(q){if(!ready())return;const m=G.me;if(m.qdone[q.key])return;if(q.need&&!(m.items[q.need]>0))return toast(`「${ITEMS[q.need].n}」이(가) 필요해요.`);if(!spend(2))return;

  log(`의뢰 「${q.n}」 ${c.ok?'완료':'실패'}`,'fac');done(c.ok?`의뢰 완료 · ${q.n}`:`의뢰 실패 · ${q.n}`,txt,out,!c.ok)}

/* 1:1 대화 행동 묘사: *별표*로 감싼 부분. 빈 잇몸이어도 이 부분은 발음이 새지 않는다. */
const ACT_RE=/(\*[^*\n]+\*)/,isAct=p=>/^\*[^*\n]+\*$/.test(p);
function gumKeep(v){return String(v).split(ACT_RE).map(p=>isAct(p)?p:gumify(p)).join('')}
function actNodes(t){return String(t||'').split(ACT_RE).filter(Boolean).map(p=>isAct(p)?h('em',{class:'act'},p.slice(1,-1)):p)}

/* ---------- 시작 ---------- */
async function boot(){
  if(!sb){gate(h('div',{class:'card stack'},gateHead(),h('p',null,'Supabase 주소와 공개 키가 아직 들어 있지 않아요. 파일 맨 위의 SUPABASE_URL과 SUPABASE_KEY를 채워 주세요.')));return}
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==='PASSWORD_RECOVERY'){AUTH=session.user;showNewPassword();return}if(ev==='SIGNED_IN'&&session&&(!AUTH||AUTH.id!==session.user.id)){AUTH=session.user;afterLogin()}if(ev==='SIGNED_OUT'){AUTH=null}});
  const{data}=await sb.auth.getSession();if(data.session){AUTH=data.session.user;if(!location.hash.includes('type=recovery'))afterLogin()}else showAuth('login');
  subscribe();
  setInterval(()=>{$('clock').textContent=hm(T());if(G.me){const w=!!G.me.work;tick();if(w&&!G.me.work)save();renderLeft()}},1000);
  setInterval(()=>{if(G.me&&!document.hidden){loadOthers().then(()=>{renderPeople();if(tab==='people')renderView()});lastSaved='';dirty=true;flush()}},120000);
  setInterval(()=>{if(G.me){renderChat();document.body.classList.toggle('build',isBuild()&&!G.opts.soft)}},60000);
}
boot();
